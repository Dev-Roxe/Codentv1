<!DOCTYPE html>
<!--
  Pestana Recetas: listado de recetas y modal para crear una nueva.
  Paleta coherente con odontograma/periodontograma.
-->
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recetas</title>
  <link rel="stylesheet" href="../styles/output.css" />
  <script>
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
</head>

<body class="min-h-screen bg-[#F8F7F7] text-[#0F2532] dark:bg-[#0B1721] dark:text-slate-100">
  <main class="max-w-5xl mx-auto p-6 space-y-6">
    <header class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
      <div>
        <p class="text-xs uppercase tracking-[0.2em] text-[#1D5D69] dark:text-slate-400">Ficha clinica</p>
        <h1 class="text-2xl font-bold text-[#1D5D69] dark:text-white">Recetas</h1>
        <p class="text-sm text-[#0F2532] dark:text-slate-400">Genera y consulta las recetas registradas.</p>
      </div>
      <button id="btn-nueva-receta"
        class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-[#4EABBE] hover:bg-[#1D5D69] text-white font-semibold shadow-lg shadow-[#4EABBE]/30 transition">
        Nueva receta
      </button>
    </header>

    <section
      class="bg-white border border-[#8BCFDD]/60 rounded-3xl shadow-lg shadow-[#8BCFDD]/20 p-5 space-y-3 dark:bg-[#0E1A25] dark:border-slate-800">
      <div id="lista-recetas" class="space-y-3 text-sm text-[#0F2532] dark:text-slate-100"></div>
    </section>
  </main>

  <!-- Modal para nueva receta -->
  <div id="modal-receta" class="fixed inset-0 bg-[#0F2532]/70 backdrop-blur-sm flex items-center justify-center hidden">
    <div
      class="bg-white border border-[#8BCFDD]/60 rounded-3xl w-full max-w-xl p-6 shadow-2xl shadow-[#8BCFDD]/30 space-y-4 dark:bg-[#0E1A25] dark:border-slate-800">
      <div class="flex justify-between items-start">
        <div>
          <p class="text-[11px] uppercase tracking-[0.2em] text-[#1D5D69] dark:text-slate-400">Nueva</p>
          <h3 class="text-xl font-semibold text-[#1D5D69] dark:text-white">Receta</h3>
        </div>
        <button id="closeRecetaModal"
          class="text-slate-400 hover:text-[#0F2532] text-lg leading-none dark:hover:text-slate-100">&times;</button>
      </div>

      <div class="space-y-3">
        <div>
          <label
            class="block text-xs font-semibold uppercase tracking-[0.12em] text-[#0F2532] dark:text-slate-300">Anadir
            medicamento</label>
          <select id="select-medicamento-receta"
            class="w-full px-3 py-2.5 rounded-xl bg-white border border-[#8BCFDD] text-sm text-[#0F2532] focus:outline-none focus:ring-2 focus:ring-[#4EABBE] focus:border-[#4EABBE] dark:bg-[#0F2532] dark:border-slate-700 dark:text-slate-100"></select>
          <button type="button" id="btn-add-med-receta"
            class="mt-2 px-4 py-2 rounded-xl bg-[#4EABBE] hover:bg-[#1D5D69] text-white font-semibold shadow shadow-[#4EABBE]/30 transition">Anadir
            a la receta</button>
        </div>

        <div>
          <label
            class="block text-xs font-semibold uppercase tracking-[0.12em] text-[#0F2532] dark:text-slate-300">Contenido
            de la
            receta</label>
          <textarea id="receta-contenido"
            class="w-full px-3 py-2.5 rounded-xl bg-white border border-[#8BCFDD] text-sm text-[#0F2532] placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-[#4EABBE] focus:border-[#4EABBE] h-40 dark:bg-[#0F2532] dark:border-slate-700 dark:text-slate-100"></textarea>
        </div>

        <div class="flex justify-end gap-2">
          <button type="button" id="cancelReceta"
            class="px-4 py-2 rounded-xl border border-[#8BCFDD] text-[#0F2532] hover:border-[#4EABBE] hover:text-[#1D5D69] transition dark:text-slate-100 dark:border-slate-700 dark:hover:border-[#4EABBE] dark:hover:text-white">Cancelar</button>
          <button type="button" id="saveReceta"
            class="px-5 py-2.5 rounded-xl bg-[#4EABBE] hover:bg-[#1D5D69] text-white font-semibold shadow-lg shadow-[#4EABBE]/30 transition">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../scripts/recetas.js"></script>
</body>

</html>
