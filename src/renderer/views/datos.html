<!DOCTYPE html>
<!--
  Pestana Datos: formulario para ver y editar los datos basicos del paciente.
  Usa la misma paleta oscura que odontograma/periodontograma.
-->
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data: blob:; script-src 'self' 'unsafe-inline' file:; style-src 'self' 'unsafe-inline' file:; img-src 'self' data: blob: file:; font-src 'self' data: file:; media-src 'self' data: blob: file:; connect-src 'self' file:; frame-src 'self' file:; object-src 'none'; base-uri 'self'; form-action 'self';" />
<title>Datos del Paciente</title>
  <link rel="stylesheet" href="../styles/output.css" />
  <script>
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
  <script src="../scripts/init.js" type="module"></script>
</head>

<body class="min-h-screen bg-[#F8F7F7] text-[#0F2532] dark:bg-[#0B1721] dark:text-slate-100">
  <main class="max-w-5xl mx-auto p-6 space-y-6">
    <header class="space-y-1">

<body class="min-h-screen bg-[#F8F7F7] text-[#0F2532] dark:bg-[#0B1721] dark:text-slate-100">
  <main class="max-w-5xl mx-auto p-6 space-y-6">
    <header class="space-y-1">
      <p class="text-xs uppercase tracking-[0.2em] text-[#1D5D69] dark:text-slate-400">Ficha clinica</p>
      <h1 class="text-2xl font-bold text-[#1D5D69] dark:text-white">Datos del paciente</h1>
      <p class="text-sm text-[#0F2532] dark:text-slate-400">Edita la informacion base para contacto y seguimiento.
      </p>
    </header>

    <section
      class="bg-white border border-[#8BCFDD]/60 rounded-3xl shadow-lg shadow-[#8BCFDD]/20 p-6 dark:bg-[#0E1A25] dark:border-slate-800">
      <form id="form-datos">
        <div id="personal-data-container" class="grid gap-4 md:grid-cols-2">
            <!-- Dynamically populated by datos.js -->
            <div class="col-span-full flex justify-center py-10">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-[#4EABBE]"></div>
            </div>
        </div>

        <div class="flex justify-end mt-6 pt-4 border-t border-gray-100 dark:border-slate-800">
          <button type="button" id="save-datos"
            class="inline-flex items-center gap-2 px-6 py-2.5 rounded-xl bg-[#4EABBE] hover:bg-[#1D5D69] text-white font-semibold shadow-lg shadow-[#4EABBE]/30 transition dark:shadow-[#4EABBE]/20">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" />
            </svg>
            Guardar Cambios
          </button>
        </div>
      </form>
    </section>
  </main>

  <script src="../scripts/datos.js" type="module"></script>
  <script src="../scripts/session-timeout.js"></script>
</body>

</html>
