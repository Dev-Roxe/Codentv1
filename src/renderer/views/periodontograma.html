<!DOCTYPE html>
<html lang="es" class="h-full">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Periodontograma</title>
  <link rel="stylesheet" href="../styles/output.css" />
  <script>
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>

  <style>
    html,
    body {
      overflow-y: auto;
    }

    /* ===== LAYOUT ===== */
    body {
      font-family: 'Inter', system-ui, sans-serif;
    }

    .perio-wrap {
      width: 100%;
      min-height: 100vh;
      overflow: visible;
      padding: 16px;
      box-sizing: border-box;
    }

    /* ===== TABLA PRINCIPAL ===== */
    .perio-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 10px;
    }

    .perio-table col.label-col-col {
      width: 260px;
    }

    .perio-table col.data-col {
      width: 20px;
    }

    /* Escala automÃ¡tica segÃºn ancho de ventana */
    @media (max-width: 1600px) {
      .perio-table {
        font-size: 9px;
      }
    }

    @media (max-width: 1300px) {
      .perio-table {
        font-size: 8px;
      }
    }

    @media (max-width: 1100px) {
      .perio-table {
        zoom: 0.85;
      }
    }

    @media (max-width: 900px) {
      .perio-table {
        zoom: 0.7;
      }
    }

    .perio-table td,
    .perio-table th {
      border: 1px solid #cbd5e1;
      padding: 1px 2px;
      text-align: center;
      vertical-align: middle;
      white-space: nowrap;
      overflow: hidden;
    }

    .dark .perio-table td,
    .dark .perio-table th {
      border-color: #334155;
    }

    /* Columna de etiquetas */
    .perio-table .label-col {
      width: 260px;
      min-width: 260px;
      max-width: 260px;
      text-align: right;
      padding-right: 6px;
      font-weight: 700;
      font-size: 9px;
      background: #f8fafc;
      border: none;
      border-right: 2px solid #cbd5e1;
      color: #374151;
    }

    .dark .perio-table .label-col {
      background: #0f172a;
      color: #94a3b8;
      border-right-color: #334155;
    }

    /* Celdas de datos */
    .perio-table .data-cell {
      width: 20px;
      min-width: 18px;
      max-width: 24px;
      height: 18px;
      padding: 0;
    }

    /* Celda de diente (colspan 3) */
    .perio-table .tooth-cell {
      height: 130px;
      padding: 0;
      background: transparent;
      border-left: 2px solid #94a3b8;
      border-right: 1px solid #e2e8f0;
      position: relative;
    }

    .dark .perio-table .tooth-cell {
      background: transparent;
      border-left-color: #475569;
    }

    /* Separador de cuadrantes */
    .perio-table .quad-sep {
      border-right: 3px solid #ef4444 !important;
    }

    /* Banner de arcada */
    .arcada-banner {
      background: #9b1c1c;
      color: white;
      font-weight: 800;
      font-size: 11px;
      letter-spacing: 0.15em;
      padding: 4px 8px;
      text-align: left;
    }

    .dark .arcada-banner {
      background: #7f1d1d;
    }

    /* Fila de nÃºmeros de dientes */
    .tooth-num-cell {
      font-weight: 800;
      font-size: 10px;
      color: #1e40af;
      background: #eff6ff;
      padding: 3px 1px;
    }

    .dark .tooth-num-cell {
      background: #1e3a8a;
      color: #93c5fd;
    }

    /* Input numÃ©rico */
    .perio-input {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
      text-align: center;
      font-size: 10px;
      font-weight: 700;
      color: inherit;
      cursor: text;
      outline: none;
      padding: 0;
      -moz-appearance: textfield;
      appearance: textfield;
    }

    .perio-input::-webkit-inner-spin-button,
    .perio-input::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .perio-input:focus {
      background: rgba(78, 171, 190, 0.12);
    }

    .dark .perio-input {
      color: #e2e8f0;
    }

    /* Colores de profundidad */
    .d-normal {
      background: #dbeafe;
      color: #1e40af;
    }

    .d-moderate {
      background: #fed7aa;
      color: #9a3412;
    }

    .d-severe {
      background: #fecaca;
      color: #991b1b;
    }

    /* Colores de anchura de encia (mm) */
    .a-low {
      background: #fee2e2;
      color: #b91c1c;
    }

    .a-mid {
      background: #fef3c7;
      color: #92400e;
    }

    .a-good {
      background: #dcfce7;
      color: #166534;
    }

    .dark .d-normal {
      background: #1e3a8a;
      color: #93c5fd;
    }

    .dark .d-moderate {
      background: #7c2d12;
      color: #fdba74;
    }

    .dark .d-severe {
      background: #7f1d1d;
      color: #fca5a5;
    }

    .dark .a-low {
      background: #7f1d1d;
      color: #fecaca;
    }

    .dark .a-mid {
      background: #713f12;
      color: #fde68a;
    }

    .dark .a-good {
      background: #14532d;
      color: #86efac;
    }

    /* Celdas booleanas (sangrado, placa, etc.) */
    .bool-cell {
      cursor: pointer;
      font-size: 11px;
      font-weight: 800;
      user-select: none;
      transition: background 0.12s;
    }

    .bool-cell:hover {
      background: rgba(78, 171, 190, 0.15);
    }

    .bool-sangrado {
      background: #fee2e2;
      color: #dc2626;
    }

    .bool-supuracion {
      background: #fef3c7;
      color: #b45309;
    }

    .bool-placa {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .dark .bool-sangrado {
      background: #7f1d1d;
      color: #fca5a5;
    }

    .dark .bool-supuracion {
      background: #713f12;
      color: #fcd34d;
    }

    .dark .bool-placa {
      background: #1e3a8a;
      color: #93c5fd;
    }

    /* Celda de furca */
    .furca-cell {
      cursor: pointer;
      font-size: 13px;
      font-weight: 800;
    }

    .furca-I {
      color: #0284c7;
    }

    .furca-II {
      color: #d97706;
    }

    .furca-III {
      color: #dc2626;
    }

    /* Fila de dientes con grÃ¡fica superpuesta */
    .tooth-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tooth-svg-wrap {
      width: 100%;
      height: 100%;
      position: relative;
      z-index: 1;
    }

    .depth-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    /* Dark mode para celdas de dientes en overlay */
    .dark .dark-tooth-bg {
      background: #1e293b !important;
      border-left-color: #475569 !important;
      border-right-color: #334155 !important;
    }

    /* Leyenda de lÃ­neas de profundidad */
    .chart-legend-row td {
      padding: 4px 8px;
      background: #f8fafc;
      border-top: 1px solid #e2e8f0;
      font-size: 10px;
    }

    .dark .chart-legend-row td {
      background: #0f172a;
      border-top-color: #1e293b;
    }

    /* Fila de grÃ¡fica de profundidad */
    .chart-row td {
      height: 80px;
      padding: 0;
      background: #f8fafc;
    }

    .dark .chart-row td {
      background: #0f172a;
    }

    /* Separador visual entre arcadas */
    .arcada-gap {
      height: 24px;
      background: transparent;
      border: none;
    }

    /* SecciÃ³n card */
    .perio-section {
      background: white;
      border-radius: 16px;
      border: 1px solid rgba(139, 207, 221, 0.3);
      box-shadow: 0 4px 24px rgba(139, 207, 221, 0.15);
      padding: 0;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .dark .perio-section {
      background: #0e1a25;
      border-color: #1e293b;
    }

    /* Toolbar */
    .toolbar {
      background: white;
      border-radius: 16px;
      border: 1px solid rgba(139, 207, 221, 0.3);
      box-shadow: 0 4px 24px rgba(139, 207, 221, 0.15);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .dark .toolbar {
      background: #0e1a25;
      border-color: #1e293b;
    }

    /* Movilidad input */
    .mov-input {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
      text-align: center;
      font-size: 10px;
      font-weight: 700;
      cursor: text;
      outline: none;
      padding: 0;
    }

    .dark .mov-input {
      color: #e2e8f0;
    }

    .mov-input:focus {
      background: rgba(78, 171, 190, 0.12);
    }

    /* Implante checkbox visual */
    .implante-cell {
      cursor: pointer;
      font-size: 12px;
      user-select: none;
    }

    .implante-on {
      color: #059669;
      font-weight: 800;
    }

    /* Nota input */
    .nota-input {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
      text-align: center;
      font-size: 9px;
      cursor: text;
      outline: none;
      padding: 0;
    }

    .dark .nota-input {
      color: #e2e8f0;
    }

    .nota-input:focus {
      background: rgba(78, 171, 190, 0.12);
    }

    /* Columna activa visual */
    .active-col {
      background-color: rgba(78, 171, 190, 0.08) !important;
    }

    .dark .active-col {
      background-color: rgba(78, 171, 190, 0.15) !important;
    }

    /* ===== CODENT CLINICAL MODE ===== */
    .codent-mode {
      background: #eef5f8 !important;
      color: #0F2532 !important;
      font-family: 'Inter', system-ui, sans-serif !important;
      /* Ajusta solo este valor para el ancho de la primera columna */
      --label-col-width: 160px;
      --data-col-width: calc((100% - var(--label-col-width)) / 48);
    }

    .codent-mode .perio-wrap {
      max-width: 1320px;
      margin: 12px auto;
      background: #ffffff;
      border: 1px solid #d7e6eb;
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 12px 30px rgba(29, 93, 105, 0.08);
    }

    .codent-mode .perio-section {
      border: 1px solid #d3e4ea;
      border-radius: 14px;
      box-shadow: 0 6px 18px rgba(78, 171, 190, 0.12);
      margin-bottom: 10px;
      background: #ffffff !important;
      overflow: hidden;
    }

    .codent-mode .toolbar {
      border: 1px solid #d3e4ea;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(78, 171, 190, 0.12);
      padding: 8px 10px;
      margin-bottom: 10px;
      background: linear-gradient(180deg, #f7fbfd 0%, #eff7fa 100%) !important;
    }

    .codent-top {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 12px;
      align-items: start;
      margin-bottom: 8px;
    }

    .codent-logo {
      width: 72px;
      height: 72px;
      border-radius: 14px;
      background: linear-gradient(135deg, #1D5D69 0%, #4EABBE 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .codent-logo img {
      width: 44px;
      height: 44px;
      object-fit: contain;
      position: relative;
      z-index: 2;
    }

    .codent-logo-fallback {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      z-index: 1;
    }

    .codent-head-main h1 {
      font-size: 28px;
      font-weight: 800;
      line-height: 1;
      margin: 1px 0 4px;
      color: #1D5D69;
    }

    .codent-subtitle {
      margin: 0 0 2px;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 700;
      color: #4EABBE;
    }

    .codent-fields {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .codent-field {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 4px;
      align-items: center;
      font-size: 10px;
    }

    .codent-field-label {
      color: #1D5D69;
      font-weight: 700;
      white-space: nowrap;
    }

    .codent-field-value {
      min-height: 15px;
      border: 1px solid #b8d9e1;
      background: #f3fbfd;
      padding: 1px 5px;
      font-size: 10px;
      color: #0F2532;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      border-radius: 4px;
    }

    .codent-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 170px;
      font-size: 10px;
      color: #1D5D69;
      font-weight: 700;
      text-align: right;
    }

    .codent-meta-line {
      display: flex;
      justify-content: flex-end;
      gap: 4px;
      align-items: center;
    }

    .codent-meta-value {
      padding: 1px 6px;
      border: 1px solid #b8d9e1;
      background: #f3fbfd;
      border-radius: 6px;
      color: #0F2532;
    }

    .codent-mode .perio-table {
      font-size: 8px;
      table-layout: fixed;
      width: 100%;
      max-width: 100%;
      background: #ffffff;
    }

    .codent-mode .perio-table td,
    .codent-mode .perio-table th {
      border-color: #c6dbe2;
      padding: 0 1px;
      color: #153743;
      background: #ffffff;
    }

    .codent-mode .perio-table .label-col {
      width: var(--label-col-width);
      min-width: var(--label-col-width);
      max-width: var(--label-col-width);
      border-right: 1px solid #c6dbe2;
      background: #f5fbfd;
      color: #1D5D69;
      font-size: 9px;
      font-weight: 800;
      text-align: left;
      padding-left: 8px;
      padding-right: 6px;
      white-space: nowrap;
      overflow: visible;
      text-overflow: clip;
      line-height: 1.15;
    }

    .codent-mode .perio-table td.label-col {
      width: var(--label-col-width) !important;
      min-width: var(--label-col-width) !important;
      max-width: var(--label-col-width) !important;
    }

    .codent-mode .perio-table col.label-col-col {
      width: var(--label-col-width);
    }

    .codent-mode .perio-table col.data-col {
      width: var(--data-col-width);
    }

    .codent-mode .perio-table .data-cell {
      width: auto;
      min-width: 0;
      max-width: none;
      height: 14px;
    }

    .codent-mode .tooth-cell {
      height: 108px;
      background: transparent;
      border-left: 1px solid #c5dbe2;
      border-right: 1px solid #c5dbe2;
    }

    .codent-mode .quad-sep {
      border-right: 2px solid #4EABBE !important;
    }

    .codent-mode .arcada-banner {
      background: linear-gradient(90deg, #1D5D69 0%, #4EABBE 100%);
      color: #fff;
      text-align: center;
      letter-spacing: 0.15em;
      font-size: 10px;
      padding: 2px 6px;
      font-weight: 800;
    }

    .codent-mode .tooth-num-cell {
      background: #eef8fb;
      color: #1D5D69;
      font-size: 9px;
      font-weight: 800;
    }

    .codent-mode .perio-input,
    .codent-mode .mov-input,
    .codent-mode .nota-input {
      font-size: 8px;
      font-weight: 700;
      color: #0F2532;
    }

    .codent-mode .bool-cell {
      font-size: 9px;
      font-weight: 700;
    }

    .codent-mode .bool-sangrado,
    .codent-mode .bool-supuracion,
    .codent-mode .bool-placa,
    .codent-mode .d-normal,
    .codent-mode .d-moderate,
    .codent-mode .d-severe {
      background: #ffffff;
      color: #111827;
    }

    .codent-mode .a-low {
      background: #fee2e2;
      color: #b91c1c;
    }

    .codent-mode .a-mid {
      background: #fef3c7;
      color: #92400e;
    }

    .codent-mode .a-good {
      background: #dcfce7;
      color: #166534;
    }

    .codent-mode .dark-tooth-bg {
      background: transparent !important;
      border-left-color: #c5dbe2 !important;
      border-right-color: #c5dbe2 !important;
    }

    /* Geometric Tooth Styles (OdontoRender) */
    .geo-mini {
      display: inline-block;
      position: relative;
    }

    .geo-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .geo-circle {
      fill: #ffffff;
      stroke: #cbd5e1;
      stroke-width: 1.2;
      transition: all .16s ease;
    }

    .geo-sector {
      fill: #ffffff;
      stroke: #94a3b8;
      stroke-width: 0.6;
      transition: all .12s ease;
    }

    .dark .geo-circle {
      fill: #ffffff;
      stroke: #cbd5e1;
    }

    .dark .geo-sector {
      fill: #ffffff;
      stroke: #cbd5e1;
    }


    .geo-cross {
      stroke: #ef4444;
      stroke-width: 4;
    }

    @media print {
      body {
        background-color: white !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      .no-print, .toolbar, .codent-top {
        display: none !important;
      }
      .codent-mode .perio-wrap {
        border: none !important;
        box-shadow: none !important;
        margin: 0 !important;
        padding: 0 !important;
        max-width: none !important;
      }
      .perio-section {
        border: none !important;
        box-shadow: none !important;
      }
      .perio-table {
        transform: scale(0.9);
        transform-origin: top center;
      }
    }

  </style>
</head>

<body class="codent-mode">
  <div class="perio-wrap">

    <!-- Header -->
    <header class="codent-top">
      <div class="codent-logo">
        <span class="codent-logo-fallback">CODENT</span>
        <img src="../assets/icons/app.png" alt="Codent"
          onload="this.previousElementSibling.style.display='none'"
          onerror="this.style.display='none'; this.previousElementSibling.style.display='flex'">
      </div>
      <div class="codent-head-main">
        <p class="codent-subtitle">Ficha clinica</p>
        <h1>Periodontograma</h1>
        <div class="codent-fields">
          <div class="codent-field">
            <span class="codent-field-label">Nombre</span>
            <span id="pacienteNombre" class="codent-field-value">--</span>
          </div>
          <div class="codent-field">
            <span class="codent-field-label">Apellido</span>
            <span id="pacienteApellido" class="codent-field-value">--</span>
          </div>
          <div class="codent-field">
            <span class="codent-field-label">Fecha de nacimiento</span>
            <span id="pacienteFechaNacimiento" class="codent-field-value">--</span>
          </div>
          <div class="codent-field">
            <span class="codent-field-label">N HC</span>
            <span id="pacienteHC" class="codent-field-value">--</span>
          </div>
        </div>
      </div>
      <div class="codent-meta">
        <div class="codent-meta-line">
          <span>Actualizado:</span>
          <span id="headerDateTime" class="codent-meta-value">--</span>
        </div>
        <div class="codent-meta-line">
          <span>Paciente:</span>
          <span id="pacienteId" class="codent-meta-value">--</span>
        </div>
      </div>
    </header>

    <!-- Toolbar -->
    <div class="toolbar no-print">
      <div class="flex gap-2">
        <button id="btnGuardar"
          class="px-4 py-1.5 rounded-md text-xs font-bold text-white bg-gradient-to-r from-[#1D5D69] to-[#4EABBE] hover:brightness-110 transition">
          Guardar
        </button>
        <button id="btnReset"
          class="px-4 py-1.5 rounded-md text-xs font-bold border border-[#8BCFDD] text-[#1D5D69] bg-white hover:bg-[#F0FAFC] transition">
          Limpiar
        </button>
      </div>
      <div>
        <button id="btn-print-periodontograma" class="flex items-center gap-2 px-4 py-1.5 bg-[#1D5D69] hover:bg-[#0F2532] text-white rounded-md text-xs font-bold shadow-md transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
          Imprimir
        </button>
      </div>
    </div>

    <!-- Arcada Superior -->
    <div class="perio-section">
      <table id="tablaSuperior" class="perio-table"></table>
    </div>

    <!-- Arcada Inferior -->
    <div class="perio-section">
