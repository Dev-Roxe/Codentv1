<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro - App Dental</title>
  <link href="../styles/output.css" rel="stylesheet">
</head>
<body class="flex items-center justify-center h-screen bg-gray-100">

  <div class="flex w-[800px] h-[450px] rounded-xl shadow-lg overflow-hidden">
    
    <!-- PANEL IZQUIERDO - LOGIN -->
    <div class="w-1/2 bg-blue-500 flex flex-col justify-center items-center text-center p-8 text-white">
      <h2 class="text-3xl font-bold mb-4">¡BIENVENIDO OTRA VEZ!</h2>
      <p class="text-sm mb-6">
        Para mantenerte conectado con nosotros <br>
        inicia sesión con tu cuenta personal
      </p>
      <a href="index.html" class="bg-white text-blue-500 px-6 py-2 rounded-lg font-semibold hover:bg-gray-100">
        INICIAR SESIÓN
      </a>
    </div>

    <!-- PANEL DERECHO - REGISTRO -->
    <div class="w-1/2 bg-white flex flex-col justify-center items-center p-8">
      <h2 class="text-2xl font-bold mb-4">CREAR CUENTA</h2>

      <!-- Botón Google -->
      <button class="flex items-center border px-4 py-2 rounded-lg mb-4 hover:bg-gray-100">
        <img src="https://cdn-icons-png.flaticon.com/512/281/281764.png" alt="Google" class="w-6 h-6 mr-2">
        <span class="text-sm">USA TU CUENTA</span>
      </button>

      <!-- Inputs -->
      <input id="fullname" type="text" placeholder="Nombre completo" 
        class="w-full border rounded-lg px-3 py-2 mb-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
      <input id="email" type="email" placeholder="Correo electrónico" 
        class="w-full border rounded-lg px-3 py-2 mb-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
      <input id="password" type="password" placeholder="Contraseña" 
        class="w-full border rounded-lg px-3 py-2 mb-3 focus:outline-none focus:ring-2 focus:ring-blue-500">

      <!-- Botón registro -->
      <button id="registerBtn" class="bg-blue-500 text-white px-6 py-2 rounded-lg font-semibold hover:bg-blue-600">
        REGISTRARME
      </button>

      <div id="msg" class="mt-2 text-red-500 text-center"></div>
    </div>

  </div>

  <script src="../scripts/register.js"></script>
</body>
</html>
