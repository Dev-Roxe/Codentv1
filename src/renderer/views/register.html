<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Sonalia</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex items-center justify-center min-h-screen bg-[#F8F7F7]">

  <div class="flex w-full max-w-4xl rounded-2xl overflow-hidden bg-white shadow-sm border border-gray-200">

    <!-- PANEL IZQUIERDO -->
    <div class="hidden md:flex md:w-2/5 flex-col justify-between p-12 bg-[#4EABBE]">

      <div>
        <div class="mb-12">
          <img src="../assets/V2 BLANCO .png" alt="Sonalia" class="h-10 w-auto">
        </div>

        <h1 class="text-3xl font-light text-white mb-4">
          Sistema de Gestión<br>Dental Profesional
        </h1>
        <p class="text-white text-sm opacity-90 leading-relaxed">
          Plataforma completa para la administración<br>
          de consultorios y clínicas dentales
        </p>
      </div>

      <div class="text-white text-xs opacity-75">
        <p>¿Ya tienes una cuenta?</p>
        <a href="login.html"
          class="inline-block mt-3 px-6 py-2 border border-white rounded-lg hover:bg-white hover:text-[#4EABBE] transition text-sm font-medium">
          Iniciar Sesión
        </a>
      </div>

    </div>

    <!-- PANEL DERECHO - REGISTRO -->
    <div class="w-full md:w-3/5 p-12">

      <div class="max-w-md mx-auto">

        <h2 class="text-2xl font-semibold text-gray-900 mb-2">Crear cuenta nueva</h2>
        <p class="text-sm text-gray-500 mb-8">Complete los siguientes datos</p>

        <!-- Formulario -->
        <form id="registerForm" class="space-y-5">

          <!-- Nombre completo -->
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-2 uppercase tracking-wide">Nombre completo</label>
            <input id="name" type="text" placeholder="Nombre" required
              class="w-full px-4 py-2.5 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#4EABBE] focus:ring-1 focus:ring-[#4EABBE] transition">
          </div>

          <!-- Apellidos en grid -->

          <div>
            <label class="block text-xs font-medium text-gray-700 mb-2 uppercase tracking-wide">Apellidos</label>
            <input id="surnames" type="text" placeholder="Primer apellido" required
              class="w-full px-4 py-2.5 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#4EABBE] focus:ring-1 focus:ring-[#4EABBE] transition">
          </div>

          <!-- Email -->
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-2 uppercase tracking-wide">Correo
              electrónico</label>
            <input id="email" type="email" placeholder="correo@ejemplo.com" required
              class="w-full px-4 py-2.5 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#4EABBE] focus:ring-1 focus:ring-[#4EABBE] transition">
          </div>

          <!-- Contraseña -->
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-2 uppercase tracking-wide">Contraseña</label>
            <input id="password" type="password" placeholder="Mínimo 8 caracteres" required
              class="w-full px-4 py-2.5 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#4EABBE] focus:ring-1 focus:ring-[#4EABBE] transition">
            <p class="text-xs text-gray-500 mt-1.5">Debe contener al menos 8 caracteres</p>
          </div>

          <!--Tekefono-->
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-medium text-gray-700 mb-2 uppercase tracking-wide">Telefono</label>
              <input id="phone" type="numberphone" placeholder="Telefono" required
                class="w-full px-4 py-2.5 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#4EABBE] focus:ring-1 focus:ring-[#4EABBE] transition">
            </div>

            <!-- Rol -->
            <div>
              <label class="block text-xs font-medium text-gray-700 mb-2 uppercase tracking-wide">Rol</label>
              <select id="rol" required
                class="w-full px-4 py-2.5 bg-white border border-gray-300 rounded-lg text-sm text-gray-700 focus:outline-none focus:border-[#4EABBE] focus:ring-1 focus:ring-[#4EABBE] transition appearance-none">
                <option value="" disabled selected hidden>Selecciona una opción</option>
                <option value="Especialista">Especialista</option>
                <option value="Recepcionista">Recepcionista</option>
                <option value="Administrador">Administrador</option>
              </select>
            </div>


            <!-- Checkbox -->
            <div class="flex items-start pt-2">
              <input id="terms" type="checkbox" required
                class="mt-0.5 w-4 h-4 text-[#4EABBE] border-gray-300 rounded focus:ring-[#4EABBE]">
              <label for="terms" class="ml-2.5 text-xs text-gray-600 leading-relaxed">
                Acepto los términos y condiciones del servicio y autorizo el tratamiento de mis datos personales
                conforme a la política de privacidad
              </label>
            </div>

            <!-- Botón registro -->
            <button id="registerBtn" type="submit"
              class="w-full bg-[#4EABBE] text-white py-3 rounded-lg font-medium text-sm hover:bg-[#3d8a99] transition mt-6">
              Crear cuenta
            </button>

            <!-- Mensaje -->
            <div id="msg" class="text-center text-sm mt-4"></div>

        </form>

        <!-- Footer mobile -->
        <div class="md:hidden text-center pt-8 border-t border-gray-200 mt-8">
          <p class="text-xs text-gray-600">
            ¿Ya tienes cuenta?
            <a href="login.html" class="text-[#4EABBE] font-medium hover:underline ml-1">Inicia sesión</a>
          </p>
        </div>

      </div>
    </div>

  </div>

  <script src="../scripts/register.js"></script>
</body>

</html>
