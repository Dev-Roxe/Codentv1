<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sonalia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>
  <script>
    // Initialize dark mode from localStorage
    const savedTheme = localStorage.getItem('theme');
    const isDark = savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches);
    if (isDark) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
</head>

<body
  class="flex items-center justify-center min-h-screen bg-[#F8F7F7] dark:bg-gray-900 transition-colors duration-200">

  <div
    class="flex w-full max-w-4xl rounded-2xl overflow-hidden bg-white dark:bg-gray-800 shadow-sm border border-gray-200 dark:border-gray-700 transition-colors duration-200">

    <!-- PANEL IZQUIERDO - LOGIN -->
    <div class="w-full md:w-3/5 p-12">

      <div class="max-w-md mx-auto">

        <h2 class="text-2xl font-semibold text-gray-900 dark:text-white mb-2">Iniciar sesión</h2>
        <p class="text-sm text-gray-500 dark:text-gray-400 mb-8">Accede a tu cuenta profesional</p>

        <!-- Formulario -->
        <form id="loginForm" class="space-y-5">

          <!-- Email/Usuario -->
          <div>
            <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-2 uppercase tracking-wide">Email
              o usuario</label>
            <input id="username" type="text" placeholder="correo@ejemplo.com" required
              class="w-full px-4 py-2.5 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg text-sm text-gray-900 dark:text-white focus:outline-none focus:border-[#4EABBE] focus:ring-1 focus:ring-[#4EABBE] transition">
          </div>

          <!-- Contraseña -->
          <div>
            <label
              class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-2 uppercase tracking-wide">Contraseña</label>
            <input id="password" type="password" placeholder="Ingresa tu contraseña" required
              class="w-full px-4 py-2.5 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg text-sm text-gray-900 dark:text-white focus:outline-none focus:border-[#4EABBE] focus:ring-1 focus:ring-[#4EABBE] transition">
          </div>

          <!-- Recordarme y Olvidaste -->
          <div class="flex items-center justify-between">
            <label class="flex items-center">
              <input type="checkbox"
                class="w-4 h-4 text-[#4EABBE] border-gray-300 dark:border-gray-600 rounded focus:ring-[#4EABBE] bg-white dark:bg-gray-700">
              <span class="ml-2 text-xs text-gray-600 dark:text-gray-400">Recordarme</span>
            </label>
            <a href="#" class="text-xs text-[#4EABBE] hover:text-[#3d8a99] font-medium">
              ¿Olvidaste tu contraseña?
            </a>
          </div>

          <!-- Botón login -->
          <button id="loginBtn" type="submit"
            class="w-full bg-[#4EABBE] text-white py-3 rounded-lg font-medium text-sm hover:bg-[#3d8a99] transition mt-6">
            Iniciar sesión
          </button>

          <!-- Mensaje -->
          <div id="msg" class="text-center text-sm mt-4 dark:text-gray-300"></div>

        </form>

        <!-- Divisor -->
        <div class="flex items-center my-8">
          <div class="flex-1 border-t border-gray-300 dark:border-gray-600"></div>
          <span class="px-4 text-xs text-gray-500 dark:text-gray-400">O continúa con</span>
          <div class="flex-1 border-t border-gray-300 dark:border-gray-600"></div>
        </div>

        <!-- Opciones alternativas -->
        <div class="space-y-3">
          <button
            class="w-full flex items-center justify-center px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 transition text-sm font-medium text-gray-700 dark:text-gray-200 bg-white dark:bg-gray-800">
            <svg class="w-5 h-5 mr-2" viewBox="0 0 24 24">
              <path fill="#4285F4"
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
              <path fill="#34A853"
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
              <path fill="#FBBC05"
                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
              <path fill="#EA4335"
                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
            </svg>
            Google
          </button>

          <button
            class="w-full flex items-center justify-center px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 transition text-sm font-medium text-gray-700 dark:text-gray-200 bg-white dark:bg-gray-800">
            <svg class="w-5 h-5 mr-2" fill="#1877F2" viewBox="0 0 24 24">
              <path
                d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" />
            </svg>
            Facebook
          </button>
        </div>

        <!-- Footer mobile -->
        <div class="md:hidden text-center pt-8 border-t border-gray-200 dark:border-gray-600 mt-8">
          <p class="text-xs text-gray-600 dark:text-gray-400">
            ¿No tienes cuenta?
            <a href="register.html" class="text-[#4EABBE] font-medium hover:underline ml-1">Regístrate aquí</a>
          </p>
        </div>

      </div>
    </div>

    <!-- PANEL DERECHO -->
    <div
      class="hidden md:flex md:w-2/5 flex-col justify-between p-12 bg-[#4EABBE] dark:bg-[#1D5D69] transition-colors duration-200">

      <div>
        <div class="mb-12">
          <img src="../assets/V2 BLANCO .png" alt="Sonalia" class="h-10 w-auto">
        </div>

        <h1 class="text-3xl font-light text-white mb-4">
          Bienvenido de nuevo
        </h1>
        <p class="text-white text-sm opacity-90 leading-relaxed">
          Accede a tu sistema de gestión dental<br>
          y continúa administrando tu consulta
        </p>
      </div>

      <div class="text-white text-xs opacity-75">
        <p>¿Aún no tienes una cuenta?</p>
        <a href="register.html"
          class="inline-block mt-3 px-6 py-2 border border-white rounded-lg hover:bg-white hover:text-[#4EABBE] dark:hover:text-[#1D5D69] transition text-sm font-medium">
          Crear cuenta
        </a>
      </div>

    </div>

  </div>

  <script src="../scripts/login.js" type="module"></script>
</body>

</html>
