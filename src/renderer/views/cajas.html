<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sonalia - Pacientes</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-200 font-sans">

  <!-- Header -->
  <header class="bg-[#8BCFDD] text-white flex items-center justify-between px-6 py-3">
    <div class="flex items-center space-x-3">
      <!-- Logo: reemplaza texto SONALIA por una imagen SVG local -->
  <img src="../assets/V2 BLANCO .png" alt="Sonalia" class="w-20 h-auto object-contain" />
      <input type="text" placeholder="Busca pacientes por nombre o documento ID"
             class="ml-6 rounded-full px-4 py-1 text-gray-800 w-80 outline-none" />
    </div>
    <div class="flex items-center space-x-3">
      <span class="font-semibold">Nerick</span>
      <div class="w-8 h-8 rounded-full bg-white/30 flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M5.121 17.804A9 9 0 1118.364 4.561a9 9 0 01-13.243 13.243z" />
        </svg>
      </div>
    </div>
  </header>

  <!-- Nav -->
  <nav class="bg-gray-100 text-gray-700 flex space-x-6 px-8 py-2 border-b border-gray-300">
    <a href="../views/agenda_semanal.html" class="font-semibold hover:text-blue-600">Agenda</a>
    <a href="../views/pacientes.html" class="font-semibold hover:text-blue-600">Pacientes</a>
    <a href="../views/cajas.html" class="font-semibold hover:text-blue-600">Cajas</a>
    <a href="../views/administracion.html" class="font-semibold hover:text-blue-600">Administración</a>
    <a href="../views/reportes.html" class="font-semibold hover:text-blue-600">Reportes</a>
    <a href="../views/crm.html" class="font-semibold hover:text-blue-600">CRM</a>
  </nav>

  <!-- Contenedor principal -->
  <main class="max-w-4xl mx-auto bg-white mt-6 shadow rounded overflow-hidden">

    <!-- Submenú -->
    <div class="flex justify-between items-center bg-gray-50 border-b px-6 py-3 text-gray-700">
      <div class="flex items-center space-x-6">
        <button class="font-semibold">(AQUI VA LA FECHA DEL DIA)</button>
      </div>
      <div class="flex items-center space-x-6">
        <button class="font-semibold">+ Abrir Caja</button>
      </div>
    </div>

    <!-- Tabla -->
    <table class="w-full text-left border-collapse ">
      <thead class="bg-[#F8F7F7] text-black text text-[12px]">
        <tr>
          <th class="px-4 py-2">USUARIO</th>
          <th class="px-4 py-2">APERTURA</th>
          <th class="px-4 py-2">DETALLE</th>
          <th class="px-4 py-2">SALDO ANTERIOR</th>
          <th class="px-4 py-2">SALDO INTERIOR</th>
          <th class="px-4 py-2">ACUMULADO</th>
          <th class="px-4 py-2">   </th>
        </tr>
      </thead>
      <tbody>
        <tr class="border-b hover:bg-gray-50">
          <td class="px-4 py-2">DOC EVA MARITZA</td>
          <td class="px-4 py-2">30 DE MAYO</td>
          <td class="px-4 py-2">VER DETALLE</td>
          <td class="px-4 py-2">$0</td>
          <td class="px-4 py-2">$0</td>
        </tr>
        <tr><td colspan="5" class="py-2 text-center text-gray-400">...</td></tr>
      </tbody>
    </table>



  </main>

</body>
</html>
