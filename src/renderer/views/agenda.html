<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda Diaria - Sonalía</title>
  <link href="../styles/output.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>
  <script src="../components/navbar-component.js" type="module"></script>
  <script src="../scripts/init.js" type="module"></script>
</head>

<body class="bg-gray-50 dark:bg-gray-900 font-sans min-h-screen text-[#0F2532] dark:text-white">

  <!-- Navbar Component - Indica que estamos en agenda_diaria -->
  <app-navbar current="agenda_diaria" user-name="Nerick"></app-navbar>

  <!-- Encabezado -->
  <div class="max-w-[1600px] mx-auto p-6">
    <div
      class="flex flex-col md:flex-row justify-between items-center gap-4 mb-6 bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 transition-all">

      <div class="flex items-center gap-4">
        <div class="p-3 bg-gradient-to-br from-[#4EABBE] to-[#1D5D69] rounded-xl shadow-lg shadow-cyan-500/20">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
        </div>
        <div>
          <h1 class="text-2xl font-bold text-gray-900 dark:text-white tracking-tight">Agenda</h1>
          <p class="text-sm text-gray-500 dark:text-gray-400">Gestiona tus citas y horarios</p>
        </div>
      </div>

      <!-- Botones de vista: Diaria / Semanal -->
      <div class="flex p-1.5 bg-gray-100 dark:bg-gray-700/50 rounded-xl border border-gray-200 dark:border-gray-600/50">
        <button id="btnDiaria"
          class="px-6 py-2 bg-white dark:bg-gray-600 text-[#1D5D69] dark:text-white rounded-lg font-semibold shadow-sm ring-1 ring-black/5 dark:ring-white/10 transition-all">
          Diaria
        </button>
        <button id="btnSemanal"
          class="px-6 py-2 text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white font-medium transition-colors">
          Semanal
        </button>
      </div>

      <!-- Acciones -->
      <div class="flex gap-3">
        <button id="btnDarCita"
          class="px-5 py-2.5 bg-[#4EABBE] hover:bg-[#1D5D69] text-white rounded-xl font-semibold shadow-lg shadow-cyan-500/20 hover:shadow-cyan-500/30 transition-all flex items-center gap-2 transform hover:-translate-y-0.5">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
          </svg>
          Nueva Cita
        </button>

        <div class="flex gap-2">
          <button id="btnFecha"
            class="p-2.5 border border-gray-200 dark:border-gray-600 rounded-xl text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 hover:border-gray-300 dark:hover:border-gray-500 transition-all"
            title="Seleccionar Fecha">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
          </button>
          <button id="btnImprimir"
            class="p-2.5 border border-gray-200 dark:border-gray-600 rounded-xl text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 hover:border-gray-300 dark:hover:border-gray-500 transition-all"
            title="Imprimir Agenda">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Contenedor para VISTA DIARIA (lista vertical de citas) -->
    <div id="agendaContainer"
      class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl border border-gray-100 dark:border-gray-700 overflow-hidden transition-all min-h-[600px]">
      <div class="flex items-center justify-center h-full">
        <div class="text-center py-12">
          <div class="w-12 h-12 border-4 border-[#4EABBE] border-t-transparent rounded-full animate-spin mx-auto mb-4">
          </div>
          <p class="text-gray-500 dark:text-gray-400">Cargando vista...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Carga el módulo que gestiona la agenda (navbar, listeners y carga dinámica de vistas) -->
  <script type="module" src="../scripts/agenda.js"></script>
</body>

</html>
