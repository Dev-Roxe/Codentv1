<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Odontograma Digital</title>
  <link rel="stylesheet" href="../styles/output.css" />
  <script>
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
  <style>
    :root {
      --odonto-ink: #0F2532;
      --odonto-brand: #1D5D69;
      --odonto-accent: #4EABBE;
      --odonto-soft: #8BCFDD;
      --odonto-bg: #F8F7F7;
      --tooth-w: clamp(48px, 5.5vw, 68px);
      --tooth-h: calc(var(--tooth-w) * 1.3);
      --tooth-gap: clamp(6px, 1.1vw, 10px);
    }

    body {
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }

    h2, h3, .odonto-title {
      font-family: "Palatino Linotype", "Book Antiqua", Palatino, serif;
      letter-spacing: 0.2px;
    }

    #odontogramaCanvas {
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(120% 100% at 50% -10%, rgba(139, 207, 221, 0.22), rgba(255, 255, 255, 0) 55%),
        linear-gradient(180deg, #FFFFFF 0%, #F8F7F7 100%);
    }

    #odontogramaCanvas::after {
      content: "";
      position: absolute;
      inset: 14px;
      border-radius: 18px;
      border: 1px dashed rgba(139, 207, 221, 0.35);
      pointer-events: none;
    }

    .dark #odontogramaCanvas {
      background:
        radial-gradient(120% 100% at 50% -10%, rgba(78, 171, 190, 0.22), rgba(11, 23, 33, 0) 55%),
        linear-gradient(180deg, #0E1A25 0%, #0B1721 100%);
    }

    .dark #odontogramaCanvas::after {
      border-color: rgba(139, 207, 221, 0.2);
    }

    .odonto-arc {
      position: relative;
      padding: 8px 0 6px;
    }

    .odonto-arc::before {
      content: "";
      position: absolute;
      left: 6%;
      right: 6%;
      height: 34px;
      border-radius: 999px;
      background: radial-gradient(closest-side, rgba(239, 125, 138, 0.22), rgba(239, 125, 138, 0.03));
      opacity: 0.6;
      pointer-events: none;
    }

    .odonto-arc--upper::before {
      top: 8px;
    }

    .odonto-arc--lower::before {
      bottom: 8px;
    }

    .dark .odonto-arc::before {
      background: radial-gradient(closest-side, rgba(78, 171, 190, 0.25), rgba(14, 26, 37, 0.05));
    }

    .odonto-row {
      display: flex;
      flex-wrap: nowrap;
      justify-content: center;
      gap: var(--tooth-gap);
      overflow-x: auto;
      overflow-y: hidden;
      padding: 6px 6px 10px;
      scroll-snap-type: x proximity;
    }

    .odonto-row::-webkit-scrollbar {
      height: 8px;
    }

    .odonto-row::-webkit-scrollbar-thumb {
      background: rgba(29, 93, 105, 0.25);
      border-radius: 999px;
    }

    .odonto-tooth {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      min-width: var(--tooth-w);
    }

    .odonto-tooth-number {
      font-size: 11px;
      font-weight: 700;
      color: var(--odonto-brand);
      letter-spacing: 0.2px;
      opacity: 0.7;
    }

    .dark .odonto-tooth-number {
      color: #CDE9F0;
    }

    .odonto-tooth-btn {
      width: var(--tooth-w);
      height: var(--tooth-h);
      border-radius: 18px;
      background: linear-gradient(180deg, #FFFFFF, #F3F6F8);
      border: 2px solid var(--odonto-soft);
      box-shadow: 0 6px 14px rgba(15, 37, 50, 0.08);
      transition: transform 200ms ease, box-shadow 200ms ease, border-color 200ms ease;
      position: relative;
      overflow: hidden;
    }

    .dark .odonto-tooth-btn {
      background: linear-gradient(180deg, #162534, #0B1721);
    }

    .odonto-tooth-btn:hover {
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 10px 22px rgba(15, 37, 50, 0.16);
    }

    .odonto-tooth-btn.is-selected {
      border-color: var(--odonto-accent);
      box-shadow: 0 0 0 4px rgba(78, 171, 190, 0.25), 0 12px 24px rgba(15, 37, 50, 0.18);
    }

    .odonto-tooth-btn.has-treatment::after {
      content: "";
      position: absolute;
      top: 6px;
      right: 6px;
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--treat-color, #4EABBE);
      box-shadow: 0 0 0 2px #FFFFFF;
    }

    .odonto-tooth-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--odonto-accent);
      opacity: 0;
      transform: translateY(-2px);
      transition: opacity 150ms ease, transform 150ms ease;
      text-align: center;
      min-height: 12px;
    }

    .dark .odonto-tooth-label {
      color: #8BCFDD;
    }

    .odonto-tooth:hover .odonto-tooth-label {
      opacity: 0.9;
      transform: translateY(0);
    }
  </style>
</head>

<body class="min-h-screen bg-[#F8F7F7] text-[#0F2532] dark:bg-[#0B1721] dark:text-slate-100">
  <div class="h-full flex flex-col p-4">
    <!-- Toolbar superior -->
    <div class="bg-white dark:bg-[#0E1A25] rounded-xl shadow-lg p-4 mb-4 border border-[#8BCFDD]/50 dark:border-slate-800">
      <div class="flex items-center justify-between flex-wrap gap-4">
        <div class="flex items-center gap-4">
          <h2 class="text-xl font-bold text-[#1D5D69] dark:text-white" id="tituloDenticion">Odontograma</h2>
          <div class="flex gap-2">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" name="denticion" id="radioAdulto" checked class="w-4 h-4 text-[#4EABBE] focus:ring-[#4EABBE]">
              <span class="text-sm font-medium text-[#0F2532] dark:text-slate-200">Dentigrama Adulto</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" name="denticion" id="radioInfantil" class="w-4 h-4 text-[#4EABBE] focus:ring-[#4EABBE]">
              <span class="text-sm font-medium text-[#0F2532] dark:text-slate-200">Dentigrama Infantil</span>
            </label>
          </div>
        </div>
        
        <!-- Tratamientos disponibles -->
        <div class="flex items-center gap-2 flex-wrap relative">
          <div class="relative">
            <button id="btnProfilaxis" class="px-3 py-2 rounded-lg text-sm font-medium bg-[#8BCFDD]/25 dark:bg-slate-800 border border-[#8BCFDD] dark:border-slate-700 hover:bg-[#4EABBE] hover:text-white transition">
              <span>🪥</span> Profilaxis
            </button>
            <!-- Dropdown Profilaxis -->
            <div id="dropdownProfilaxis" class="hidden absolute top-full left-0 mt-2 bg-white dark:bg-[#0E1A25] rounded-lg shadow-xl border border-[#8BCFDD]/50 dark:border-slate-800 z-50 min-w-[200px]">
              <button class="w-full text-left px-4 py-2 hover:bg-[#8BCFDD]/25 dark:hover:bg-slate-800 rounded-t-lg text-[#0F2532] dark:text-slate-200" data-treatment="profilaxis-simple">
                Profilaxis Simple
              </button>
              <button class="w-full text-left px-4 py-2 hover:bg-[#8BCFDD]/25 dark:hover:bg-slate-800 rounded-b-lg text-[#0F2532] dark:text-slate-200" data-treatment="profilaxis-profunda">
                Profilaxis Profunda
              </button>
            </div>
          </div>
          <button id="btnAyuda" class="px-3 py-2 rounded-lg text-sm font-medium text-[#4EABBE] hover:underline">
            Ayuda: ¿Cómo se usa?
          </button>
        </div>
      </div>
    </div>

    <!-- Contenedor principal del odontograma -->
    <div class="flex-1 overflow-auto">
      <div id="odontogramaCanvas" class="bg-white dark:bg-[#0E1A25] rounded-xl shadow-lg p-6 border border-[#8BCFDD]/50 dark:border-slate-800">
        <div class="mb-6">

          <!-- Superior -->
          <div class="mb-8 odonto-arc odonto-arc--upper">
            <div class="text-center mb-3">
              <span class="inline-block px-4 py-2 rounded-lg text-sm font-semibold bg-[#8BCFDD] dark:bg-[#1D5D69] text-[#0F2532] dark:text-white">
                SUPERIOR
              </span>
            </div>
            <div id="filaSuperior" class="odonto-row"></div>
          </div>

          <div class="h-px rounded-full mb-8 bg-[#8BCFDD] dark:bg-slate-700"></div>

          <!-- Inferior -->
          <div class="odonto-arc odonto-arc--lower">
            <div id="filaInferior" class="odonto-row mb-3"></div>
            <div class="text-center">
              <span class="inline-block px-4 py-2 rounded-lg text-sm font-semibold bg-[#8BCFDD] dark:bg-[#1D5D69] text-[#0F2532] dark:text-white">
                INFERIOR
              </span>
            </div>
          </div>
        </div>
      </div>

      <!-- Panel de tratamientos lateral (si hay espacio) o dropdown -->
      <div id="tratamientosPanel" class="hidden fixed top-20 right-4 bg-white dark:bg-[#0E1A25] rounded-xl shadow-xl p-4 border border-[#8BCFDD]/50 dark:border-slate-800 z-50 min-w-[250px] max-w-[300px]">
        <div class="flex items-center justify-between mb-4 pb-2 border-b border-[#8BCFDD]/30 dark:border-slate-700">
          <h3 class="text-lg font-bold text-[#1D5D69] dark:text-white">Tratamientos</h3>
          <button id="btnCerrarPanel" class="text-[#1D5D69] dark:text-slate-400 hover:text-[#4EABBE]">✕</button>
        </div>
        <div class="mb-3 p-3 rounded-lg text-center bg-[rgba(78,171,190,0.15)] dark:bg-slate-800">
          <p class="text-xs mb-1 text-[#1D5D69] dark:text-slate-400 opacity-80">Pieza dental</p>
          <p id="piezaPanel" class="text-2xl font-bold text-[#4EABBE]"></p>
        </div>
        <div id="listaTratamientos" class="space-y-2"></div>
      </div>
    </div>

    <!-- Leyenda -->
    <div class="mt-4 bg-white dark:bg-[#0E1A25] rounded-xl shadow-lg p-4 border border-[#8BCFDD]/50 dark:border-slate-800">
      <div class="flex items-center gap-2 mb-4 pb-2 border-b border-[#8BCFDD]/30 dark:border-slate-700">
        <h3 class="text-lg font-bold text-[#1D5D69] dark:text-white">Leyenda de Tratamientos</h3>
      </div>
      <div id="leyenda" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3"></div>
    </div>
  </div>

  <!-- Modal caras -->
  <div id="modalOverlay" class="hidden fixed inset-0 z-50 items-center justify-center bg-[rgba(15,37,50,0.7)] dark:bg-[rgba(0,0,0,0.8)]">
    <div class="bg-white dark:bg-[#0E1A25] rounded-2xl shadow-2xl max-w-4xl w-full mx-4 overflow-hidden border border-[#8BCFDD]/50 dark:border-slate-800">
      <div class="p-6 bg-[#1D5D69] dark:bg-[#0F2532] text-white flex items-center justify-between">
        <h2 class="text-2xl font-bold">
          Selección de Caras - Pieza <span id="modalPieza"></span>
        </h2>
        <button id="btnCancelarModal"
          class="px-6 py-3 rounded-xl font-bold bg-[#6B7280] hover:bg-[#4B5563] transition"
        >
          Cancelar
        </button>
      </div>

      <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Vista -->
        <div class="rounded-xl p-4 bg-[#F8F7F7] dark:bg-[#0B1721] border-2 border-[#8BCFDD] dark:border-slate-700">
          <h3 class="text-center font-bold text-xl mb-4 text-[#1D5D69] dark:text-white">Vista Anatómica</h3>
          <div id="vistaCaras" class="w-full"></div>
        </div>

        <!-- Lista -->
        <div>
          <h3 class="font-bold text-xl mb-4 text-[#1D5D69] dark:text-white">Seleccione las caras afectadas</h3>
          <div id="listaCaras" class="space-y-3"></div>
        </div>
      </div>

      <div class="p-6 flex gap-4 border-t border-[#8BCFDD]/30 dark:border-slate-700">
        <button id="btnGuardarModal"
          class="flex-1 py-4 rounded-xl font-bold text-white shadow-lg hover:opacity-90 transition bg-[#4EABBE] dark:bg-[#1D5D69]"
        >
          Guardar
        </button>
      </div>
    </div>
  </div>

  <script src="../scripts/odontograma.js"></script>
</body>
</html>
