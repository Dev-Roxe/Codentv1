<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odontograma - Sonalía</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">

    <div class="max-w-7xl mx-auto">

        <!-- Header -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-6">
            <h1 class="text-3xl font-bold text-gray-800 mb-5">🦷 Odontograma Dental</h1>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input
                    type="text"
                    id="nombrePaciente"
                    placeholder="Nombre del paciente"
                    class="px-4 py-2 border border-gray-300 rounded-lg bg-gray-50 focus:ring-2 focus:ring-blue-500"
                />
                <input
                    type="date"
                    id="fechaConsulta"
                    class="px-4 py-2 border border-gray-300 rounded-lg bg-gray-50 focus:ring-2 focus:ring-blue-500"
                />
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">

            <!-- Panel lateral -->
            <div class="lg:col-span-1">
                <div class="bg-white rounded-xl shadow-md p-5">

                    <h2 class="text-xl font-bold text-gray-800 mb-4">Condiciones</h2>

                    <div id="dienteSeleccionado" class="hidden bg-blue-50 border-l-4 border-blue-500 p-3 rounded mb-4">
                        <p class="text-sm text-blue-800 font-semibold">
                            Diente seleccionado: <span id="numeroDiente" class="text-lg font-bold"></span>
                        </p>
                    </div>

                    <div id="botonesCondiciones" class="space-y-2">
                        <!-- Se generan con JS -->
                    </div>

                    <div class="mt-6 space-y-2">
                        <button
                            onclick="guardarOdontograma()"
                            class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg font-medium shadow-md transition"
                        >
                            💾 Guardar
                        </button>

                        <button
                            onclick="limpiarOdontograma()"
                            class="w-full bg-red-600 hover:bg-red-700 text-white py-2 rounded-lg font-medium shadow-md transition"
                        >
                            🗑 Limpiar
                        </button>
                    </div>
                </div>

                <!-- Leyenda -->
                <div class="bg-white rounded-xl shadow-md p-5 mt-4">
                    <h3 class="text-lg font-semibold text-gray-800 mb-4">Leyenda</h3>
                    <div id="leyenda" class="space-y-2"></div>
                </div>
            </div>

            <!-- Odontograma -->
            <div class="lg:col-span-3">
                <div class="bg-white rounded-xl shadow-md p-6">

                    <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Dentadura</h2>

                    <!-- Arcada superior -->
                    <div class="mb-10">
                        <h3 class="text-sm font-semibold text-gray-600 text-center mb-3">Arcada Superior</h3>
                        <div id="arcadaSuperior" class="flex justify-center gap-3 flex-wrap"></div>
                    </div>

                    <div class="border-t border-gray-300 my-6"></div>

                    <!-- Arcada inferior -->
                    <div>
                        <h3 class="text-sm font-semibold text-gray-600 text-center mb-3">Arcada Inferior</h3>
                        <div id="arcadaInferior" class="flex justify-center gap-3 flex-wrap"></div>
                    </div>

                    <div class="mt-8 p-4 bg-blue-50 rounded-lg border border-blue-200">
                        <p class="text-sm text-gray-700">
                            <strong>Instrucciones:</strong> Selecciona un diente y luego elige una condición en la izquierda.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>
/* ==========================================================
    ESTADO
========================================================== */
let dientes = {};
let dienteSeleccionado = null;

const dientesSuperiores = [18,17,16,15,14,13,12,11, 21,22,23,24,25,26,27,28];
const dientesInferiores = [48,47,46,45,44,43,42,41, 31,32,33,34,35,36,37,38];

const condiciones = [
    { id: 'sano', label: 'Sano', color: 'bg-white border-gray-300' },
    { id: 'caries', label: 'Caries', color: 'bg-red-500 text-white' },
    { id: 'obturado', label: 'Obturado', color: 'bg-blue-500 text-white' },
    { id: 'ausente', label: 'Ausente', color: 'bg-gray-900 text-white' },
    { id: 'corona', label: 'Corona', color: 'bg-yellow-500 text-white' },
    { id: 'endodoncia', label: 'Endodoncia', color: 'bg-purple-500 text-white' },
    { id: 'fractura', label: 'Fractura', color: 'bg-orange-500 text-white' },
    { id: 'implante', label: 'Implante', color: 'bg-green-500 text-white' }
];

/* ==========================================================
    INICIALIZAR FECHA
========================================================== */
document.getElementById("fechaConsulta").valueAsDate = new Date();

/* ==========================================================
    CREAR ODONTOGRAMA
========================================================== */
function crearDiente(num, contenedor) {
    const d = document.createElement("div");
    d.className = "flex flex-col items-center";

    d.innerHTML = `
        <span class="text-xs font-semibold text-gray-600">${num}</span>
        <button 
            id="diente-${num}"
            onclick="seleccionarDiente(${num})"
            class="w-12 h-14 bg-white border-2 border-gray-300 rounded-lg hover:shadow-md hover:scale-[1.05] transition relative"
        ></button>
    `;

    contenedor.appendChild(d);
}

function inicializarOdontograma(){
    const sup = document.getElementById("arcadaSuperior");
    const inf = document.getElementById("arcadaInferior");

    dientesSuperiores.forEach(n => crearDiente(n, sup));
    dientesInferiores.forEach(n => crearDiente(n, inf));

    crearBotonesCondiciones();
    crearLeyenda();
}

/* ==========================================================
    BOTONES DE CONDICIONES
========================================================== */
function crearBotonesCondiciones(){
    const cont = document.getElementById("botonesCondiciones");

    condiciones.forEach(c => {
        const b = document.createElement("button");
        b.id = `btn-${c.id}`;
        b.textContent = c.label;
        b.className = `w-full py-2 rounded-lg shadow-sm ${c.color} opacity-50 cursor-not-allowed`;
        b.onclick = () => aplicarCondicion(c.id);
        b.disabled = true;
        cont.appendChild(b);
    });
}

/* ==========================================================
    LEYENDA
========================================================== */
function crearLeyenda(){
    const cont = document.getElementById("leyenda");

    condiciones.forEach(c => {
        const item = document.createElement("div");
        item.className = "flex items-center gap-3 text-sm";

        item.innerHTML = `
            <div class="w-5 h-5 rounded border ${c.color}"></div>
            ${c.label}
        `;

        cont.appendChild(item);
    });
}

/* ==========================================================
    SELECCIONAR DIENTE
========================================================== */
function seleccionarDiente(num){
    dienteSeleccionado = num;

    document.getElementById("dienteSeleccionado").classList.remove("hidden");
    document.getElementById("numeroDiente").textContent = num;

    // Reset selección
    document.querySelectorAll("[id^='diente-']").forEach(d => {
        d.classList.remove("ring-2", "ring-blue-400", "border-blue-600");
        d.classList.add("border-gray-300");
    });

    const btn = document.getElementById(`diente-${num}`);
    btn.classList.remove("border-gray-300");
    btn.classList.add("border-blue-600", "ring-2", "ring-blue-300");

    habilitarBotones();
}

/* ==========================================================
    APLICAR CONDICIÓN
========================================================== */
function habilitarBotones(){
    condiciones.forEach(c => {
        const btn = document.getElementById(`btn-${c.id}`);
        btn.disabled = false;
        btn.classList.remove("opacity-50", "cursor-not-allowed");
        btn.classList.add("cursor-pointer", "hover:opacity-90");
    });
}

function aplicarCondicion(id){
    if(!dienteSeleccionado) return;

    dientes[dienteSeleccionado] = id;
    actualizarDiente(dienteSeleccionado);
}

/* ==========================================================
    ACTUALIZAR DIENTE
========================================================== */
function actualizarDiente(num){
    const btn = document.getElementById(`diente-${num}`);
    const estado = dientes[num];
    const cond = condiciones.find(c => c.id === estado);

    btn.className = `w-12 h-14 border-2 rounded-lg hover:scale-[1.05] transition relative ${cond?.color || "bg-white border-gray-300"}`;

    if(estado === "ausente"){
        btn.innerHTML = `<div class="absolute inset-0 flex items-center justify-center">
            <div class="w-12 h-1 bg-white rotate-45"></div>
        </div>`;
    } else {
        btn.innerHTML = "";
    }
}

/* ==========================================================
    GUARDAR ODONTOGRAMA
========================================================== */
function guardarOdontograma(){
    const datos = {
        paciente: {
            nombre: nombrePaciente.value,
            fecha: fechaConsulta.value
        },
        dientes: dientes,
        guardado: new Date().toISOString()
    };

    localStorage.setItem("odontograma", JSON.stringify(datos));

    alert("✅ Odontograma guardado.");
}

/* ==========================================================
    LIMPIAR TODO
========================================================== */
function limpiarOdontograma(){
    if(!confirm("¿Seguro? Se borrará todo.")) return;

    dientes = {};
    dienteSeleccionado = null;

    document.getElementById("dienteSeleccionado").classList.add("hidden");

    [...dientesSuperiores, ...dientesInferiores].forEach(num => {
        const btn = document.getElementById(`diente-${num}`);
        btn.className = "w-12 h-14 bg-white border-2 border-gray-300 rounded-lg hover:scale-[1.05] transition";
        btn.innerHTML = "";
    });

    condiciones.forEach(c => {
        const b = document.getElementById(`btn-${c.id}`);
        b.disabled = true;
        b.classList.add("opacity-50", "cursor-not-allowed");
        b.classList.remove("cursor-pointer");
    });

    alert("🗑 Odontograma limpiado.");
}

/* ==========================================================
    CARGAR GUARDADO
========================================================== */
function cargarOdontogramaGuardado(){
    const guardado = JSON.parse(localStorage.getItem("odontograma") || "{}");

    if(guardado.paciente){
        nombrePaciente.value = guardado.paciente.nombre || "";
        fechaConsulta.value = guardado.paciente.fecha || "";
    }

    if(guardado.dientes){
        dientes = guardado.dientes;

        Object.keys(dientes).forEach(num => actualizarDiente(parseInt(num)));
    }
}

/* ==========================================================
    INIT
========================================================== */
window.onload = () => {
    inicializarOdontograma();
    cargarOdontogramaGuardado();
};
</script>

</body>
</html>
