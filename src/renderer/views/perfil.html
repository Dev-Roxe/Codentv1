<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil - Sonalía</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../scripts/init.js" type="module"></script>
</head>
<body class="bg-gray-50">

  <!-- Navbar Component -->
  <app-navbar current="perfil" user-name="Nerick"></app-navbar>

  <!-- Contenedor Principal -->
  <div class="min-h-screen p-8">
    
    <!-- Header -->
    <div class="max-w-6xl mx-auto mb-8">
      <button onclick="history.back()" class="flex items-center gap-2 text-gray-600 hover:text-gray-900 mb-4 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
        Volver
      </button>
      <h1 class="text-4xl font-bold text-gray-900">Mi Perfil</h1>
      <p class="text-gray-600 mt-2">Administra tu información personal y preferencias</p>
    </div>

    <!-- Grid de Contenido -->
    <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <!-- Sidebar -->
      <div class="lg:col-span-1">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 sticky top-8">
          
          <!-- Avatar -->
          <div class="flex flex-col items-center mb-6">
            <div class="relative group">
              <div class="w-32 h-32 rounded-full bg-gradient-to-br from-blue-400 to-blue-600 flex items-center justify-center text-white text-4xl font-bold shadow-lg">
                JD
              </div>
            </div>
            <h2 class="text-2xl font-bold text-gray-900 mt-4" id="profile-name">Juan Pérez</h2>
            <p class="text-sm text-gray-500 mt-1" id="profile-role">Administrador</p>
            <span class="mt-3 px-4 py-1 bg-green-100 text-green-700 rounded-full text-xs font-medium">Activo</span>
          </div>

          <!-- Stats -->
          <div class="border-t border-gray-100 pt-6 space-y-4 text-sm">
            <div class="flex items-center justify-between">
              <span class="text-gray-600">Miembro desde</span>
              <span class="font-semibold text-gray-900">Enero 2024</span>
            </div>
            <div class="flex items-center justify-between">
              <span class="text-gray-600">Último acceso</span>
              <span class="font-semibold text-gray-900">Hace 2 horas</span>
            </div>
            <div class="flex items-center justify-between">
              <span class="text-gray-600">Citas gestionadas</span>
              <span class="font-semibold text-gray-900">1,247</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Contenido Principal -->
      <div class="lg:col-span-2 space-y-8">
        
        <!-- Información Personal -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
          <div class="flex items-center justify-between mb-6">
            <h3 class="text-xl font-bold text-gray-900">Información Personal</h3>
            <button id="edit-personal-btn" class="text-blue-600 hover:text-blue-700 font-medium text-sm flex items-center gap-1">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
              </svg>
              Editar
            </button>
          </div>

          <form id="personal-info-form" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Nombre</label>
                <input id="nombre" type="text" disabled class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 disabled:bg-gray-50 transition">
              </div>

              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Apellido</label>
                <input id="apellido" type="text" disabled class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 disabled:bg-gray-50 transition">
              </div>

              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                <input id="email" type="email" disabled class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 disabled:bg-gray-50 transition">
              </div>

              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Teléfono</label>
                <input id="telefono" type="tel" disabled class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 disabled:bg-gray-50 transition">
              </div>

              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Fecha de Nacimiento</label>
                <input id="nacimiento" type="date" disabled class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 disabled:bg-gray-50 transition">
              </div>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Dirección</label>
              <textarea id="direccion" rows="3" disabled class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 disabled:bg-gray-50 transition resize-none"></textarea>
            </div>

            <div id="form-actions" class="flex gap-3 pt-4 border-t border-gray-100" style="display: none;">
              <button type="submit" class="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition font-medium">
                Guardar Cambios
              </button>
              <button type="button" id="cancel-edit-btn" class="px-6 py-3 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-100 transition font-medium">
                Cancelar
              </button>
            </div>
          </form>
        </div>

      </div>
    </div>
  </div>

  <script>
    // ====== Referencias ======
    const editBtn = document.getElementById('edit-personal-btn');
    const cancelBtn = document.getElementById('cancel-edit-btn');
    const form = document.getElementById('personal-info-form');
    const actions = document.getElementById('form-actions');
    const inputs = form.querySelectorAll('input, textarea');

    const profileName = document.getElementById('profile-name');
    const profileRole = document.getElementById('profile-role');

    const nombre = document.getElementById('nombre');
    const apellido = document.getElementById('apellido');
    const email = document.getElementById('email');
    const telefono = document.getElementById('telefono');
    const nacimiento = document.getElementById('nacimiento');
    const direccion = document.getElementById('direccion');

    let usuarioId = null;

    // ====== Cargar datos del usuario logueado ======
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        // Primero intentamos obtener datos de localStorage (sesión actual)
        const sesionData = JSON.parse(localStorage.getItem('sesionActual')) || {};
        usuarioId = sesionData.id;

        // Si tenemos ID de usuario, obtenemos datos completos desde la API
        if (usuarioId && window.api?.getUserProfile) {
          const userData = await window.api.getUserProfile({ id: usuarioId });
          
          nombre.value = userData.nombre || '';
          apellido.value = userData.apellido || '';
          email.value = userData.email || '';
          telefono.value = userData.telefono || '';
          nacimiento.value = userData.nacimiento || '';
          direccion.value = userData.direccion || '';

          profileName.textContent = `${userData.nombre || ''} ${userData.apellido || ''}`.trim();
          profileRole.textContent = userData.rol || 'Usuario';

          // Actualizar navbar con nombre del usuario
          const navbar = document.querySelector('app-navbar');
          if (navbar) {
            navbar.updateUser(userData.nombre, userData.rol);
          }
        } else if (sesionData.nombre) {
          // Fallback: usar datos de localStorage si no hay API
          nombre.value = sesionData.nombre || '';
          apellido.value = sesionData.apellido || '';
          email.value = sesionData.email || '';
          telefono.value = sesionData.telefono || '';
          nacimiento.value = sesionData.nacimiento || '';
          direccion.value = sesionData.direccion || '';

          profileName.textContent = `${sesionData.nombre || ''} ${sesionData.apellido || ''}`.trim();
          profileRole.textContent = sesionData.rol || 'Usuario';
        }
      } catch (err) {
        console.error('Error al cargar datos del usuario:', err);
        alert('Error al cargar datos del perfil');
      }
    });

    // ====== Editar datos ======
    editBtn.addEventListener('click', () => {
      inputs.forEach(i => i.disabled = false);
      actions.style.display = 'flex';
      editBtn.style.display = 'none';
    });

    // ====== Cancelar edición ======
    cancelBtn.addEventListener('click', () => {
      inputs.forEach(i => i.disabled = true);
      actions.style.display = 'none';
      editBtn.style.display = 'flex';
    });

    // ====== Guardar cambios en la base de datos ======
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const updatedData = {
        id: usuarioId,
        nombre: nombre.value,
        apellido: apellido.value,
        email: email.value,
        telefono: telefono.value,
        nacimiento: nacimiento.value,
        direccion: direccion.value
      };

      try {
        // Si tenemos API disponible, guardar en DB
        if (window.api?.updateUserProfile) {
          await window.api.updateUserProfile(updatedData);
        }

        // Guardar también en localStorage para cache local
        const sesionData = JSON.parse(localStorage.getItem('sesionActual')) || {};
        const merged = { ...sesionData, ...updatedData };
        localStorage.setItem('sesionActual', JSON.stringify(merged));

        profileName.textContent = `${updatedData.nombre} ${updatedData.apellido}`.trim();

        alert('Cambios guardados correctamente');

        inputs.forEach(i => i.disabled = true);
        actions.style.display = 'none';
        editBtn.style.display = 'flex';

      } catch (err) {
        console.error('Error al guardar cambios:', err);
        alert('Error al guardar los cambios: ' + (err.message || err));
      }
    });
  </script>
</body>
</html>
