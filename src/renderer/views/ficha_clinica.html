<!DOCTYPE html>
<!--
  Pagina principal de ficha clinica.
  Muestra encabezado del paciente y carga cada pestana en iframes independientes.
-->
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ficha Clinica</title>
  <link rel="stylesheet" href="../styles/output.css" />
  <script>
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
</head>

<body class="min-h-screen bg-[#F8F7F7] text-[#0F2532] dark:bg-[#0B1721] dark:text-slate-100">
  <div class="min-h-screen flex flex-col">
    <!-- Encabezado superior -->
    <header
      class="border-b border-[#8BCFDD]/50 dark:border-slate-800 bg-white/95 dark:bg-[#0E1A25]/95 shadow-sm backdrop-blur">
      <div class="px-5 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <button id="btn-back"
            class="inline-flex items-center gap-2 px-3 py-2 text-sm font-semibold text-[#0F2532] dark:text-slate-100 bg-white dark:bg-[#101F2E] border border-[#8BCFDD] dark:border-slate-700 rounded-xl hover:bg-[#8BCFDD]/15 hover:border-[#4EABBE] hover:text-[#1D5D69] dark:hover:text-white hover:shadow transition focus:outline-none focus:ring-2 focus:ring-[#4EABBE] focus:ring-offset-2 focus:ring-offset-white dark:focus:ring-offset-[#0E1A25]">
            <span aria-hidden="true">&larr;</span>
            <span>Regresar</span>
          </button>
          <h1 class="text-xl font-bold text-[#1D5D69] dark:text-white" id="header-nombre">Información del Paciente</h1>
        </div>
        <div class="flex items-center gap-2">
          <button class="inline-flex items-center gap-2 px-3 py-2 text-sm font-semibold text-[#0F2532] dark:text-slate-100 bg-white dark:bg-[#101F2E] border border-[#8BCFDD] dark:border-slate-700 rounded-xl hover:bg-[#8BCFDD]/15 transition">
            <span>📧</span>
            <span>Enviar encuesta</span>
          </button>
          <button class="inline-flex items-center gap-2 px-3 py-2 text-sm font-semibold text-[#0F2532] dark:text-slate-100 bg-white dark:bg-[#101F2E] border border-[#8BCFDD] dark:border-slate-700 rounded-xl hover:bg-[#8BCFDD]/15 transition">
            <span>🖨️</span>
            <span>Recaudación</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Contenedor principal con layout vertical: sidebar izquierdo + contenido central -->
    <div class="flex flex-1 overflow-hidden">
      <!-- Sidebar izquierdo -->
      <aside class="w-64 border-r border-[#8BCFDD]/50 dark:border-slate-800 bg-white/95 dark:bg-[#0E1A25]/95 overflow-y-auto">
        <!-- Información del paciente -->
        <div class="p-4 border-b border-[#8BCFDD]/30 dark:border-slate-800">
          <div class="flex flex-col items-center gap-2 mb-4">
            <div class="w-16 h-16 rounded-full bg-[#8BCFDD]/20 dark:bg-slate-700 flex items-center justify-center">
              <span class="text-2xl">👤</span>
            </div>
            <div class="text-center">
              <p class="font-semibold text-[#0F2532] dark:text-slate-100" id="sidebar-nombre">Paciente</p>
              <p class="text-xs text-[#1D5D69] dark:text-slate-400" id="sidebar-id">ID</p>
              <p class="text-xs text-[#1D5D69] dark:text-slate-400" id="sidebar-edad">Edad</p>
            </div>
          </div>
        </div>

        <!-- Menú de navegación vertical -->
        <nav class="p-2 space-y-1">
          <p class="px-3 py-2 text-xs font-semibold uppercase tracking-wider text-[#1D5D69] dark:text-slate-400">Paciente</p>
          <button
            class="tab-btn w-full text-left px-3 py-2.5 text-sm rounded-lg text-[#0F2532] dark:text-slate-200 hover:bg-[#8BCFDD]/25 dark:hover:bg-slate-800 transition-colors flex items-center gap-2"
            data-tab="datos">
            <span>👤</span>
            <span>Datos Personales</span>
          </button>
          <p class="px-3 py-2 mt-4 text-xs font-semibold uppercase tracking-wider text-[#1D5D69] dark:text-slate-400">Clínico</p>
          <button
            class="tab-btn w-full text-left px-3 py-2.5 text-sm rounded-lg text-[#0F2532] dark:text-slate-200 hover:bg-[#8BCFDD]/25 dark:hover:bg-slate-800 transition-colors flex items-center gap-2"
            data-tab="recetas">
            <span>💊</span>
            <span>Prescripciones Médicas</span>
          </button>
          <button
            class="tab-btn w-full text-left px-3 py-2.5 text-sm rounded-lg text-[#0F2532] dark:text-slate-200 hover:bg-[#8BCFDD]/25 dark:hover:bg-slate-800 transition-colors flex items-center gap-2"
            data-tab="antecedentes">
            <span>📋</span>
            <span>Historial & Alertas Clínicas</span>
          </button>
          
          <button
            class="tab-btn w-full text-left px-3 py-2.5 text-sm rounded-lg text-[#0F2532] dark:text-slate-200 hover:bg-[#8BCFDD]/25 dark:hover:bg-slate-800 transition-colors flex items-center gap-2"
            data-tab="tratamientos">
            <span>❤️</span>
            <span>Planes de Tratamiento</span>
          </button>
          
          <button
            class="tab-btn w-full text-left px-3 py-2.5 text-sm rounded-lg text-[#0F2532] dark:text-slate-200 hover:bg-[#8BCFDD]/25 dark:hover:bg-slate-800 transition-colors flex items-center gap-2"
            data-tab="odontograma">
            <span>🦷</span>
            <span>Odontograma</span>
          </button>
          <button
            class="tab-btn w-full text-left px-3 py-2.5 text-sm rounded-lg text-[#0F2532] dark:text-slate-200 hover:bg-[#8BCFDD]/25 dark:hover:bg-slate-800 transition-colors flex items-center gap-2"
            data-tab="periodontograma">
            <span>🦷</span>
            <span>Periodontograma</span>
          </button>
        </nav>
      </aside>

      <!-- Contenido central principal -->
      <main class="flex-1 flex flex-col overflow-hidden">
        <!-- Área de contenido con tabs -->
        <div class="flex-1 overflow-hidden">
          <div class="relative w-full h-full">
            <iframe id="frame-datos" class="tab-frame absolute inset-0 w-full h-full border-0"></iframe>
            <iframe id="frame-antecedentes" class="tab-frame absolute inset-0 w-full h-full border-0 hidden"></iframe>
            <iframe id="frame-tratamientos" class="tab-frame absolute inset-0 w-full h-full border-0 hidden"></iframe>
            <iframe id="frame-recetas" class="tab-frame absolute inset-0 w-full h-full border-0 hidden"></iframe>
            <iframe id="frame-odontograma" class="tab-frame absolute inset-0 w-full h-full border-0 hidden"></iframe>
            <iframe id="frame-periodontograma" class="tab-frame absolute inset-0 w-full h-full border-0 hidden"></iframe>
            <iframe id="frame-galeria" class="tab-frame absolute inset-0 w-full h-full border-0 hidden"></iframe>
            <iframe id="frame-contactos" class="tab-frame absolute inset-0 w-full h-full border-0 hidden"></iframe>
            <iframe id="frame-diagnostico" class="tab-frame absolute inset-0 w-full h-full border-0 hidden"></iframe>
            <iframe id="frame-documentos" class="tab-frame absolute inset-0 w-full h-full border-0 hidden"></iframe>
            <iframe id="frame-agenda" class="tab-frame absolute inset-0 w-full h-full border-0 hidden"></iframe>
          </div>
        </div>

        <!-- Tabla de historial en la parte inferior -->
        <div class="border-t border-[#8BCFDD]/50 dark:border-slate-800 bg-white dark:bg-[#0E1A25] p-4 max-h-48 overflow-y-auto">
          <h3 class="text-sm font-semibold text-[#1D5D69] dark:text-slate-300 mb-2">Historial de Servicios</h3>
          <table class="w-full text-sm">
            <thead>
              <tr class="border-b border-[#8BCFDD]/30 dark:border-slate-700">
                <th class="text-left py-2 px-3 text-[#1D5D69] dark:text-slate-400">Fecha</th>
                <th class="text-left py-2 px-3 text-[#1D5D69] dark:text-slate-400">Servicio</th>
                <th class="text-left py-2 px-3 text-[#1D5D69] dark:text-slate-400">Pieza</th>
                <th class="text-left py-2 px-3 text-[#1D5D69] dark:text-slate-400">Caras</th>
              </tr>
            </thead>
            <tbody id="historial-servicios">
              <!-- El historial se cargará dinámicamente -->
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <script src="../scripts/ficha_clinica.js"></script>
</body>

</html>
