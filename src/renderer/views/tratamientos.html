<!DOCTYPE html>
<!--
  Pestana Tratamientos: listado y modal para nuevos procedimientos.
  Usa la paleta oscura alineada con odontograma/periodontograma.
-->
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tratamientos</title>
  <link rel="stylesheet" href="../styles/output.css" />
  <script>
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
</head>

<body class="min-h-screen bg-[#F8F7F7] text-[#0F2532] dark:bg-[#0B1721] dark:text-slate-100">
  <main class="max-w-6xl mx-auto p-6 space-y-6">
    <header class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
      <div>
        <p class="text-xs uppercase tracking-[0.2em] text-[#1D5D69] dark:text-slate-400">Ficha clinica</p>
        <h1 class="text-2xl font-bold text-[#1D5D69] dark:text-white">Tratamientos</h1>
        <p class="text-sm text-[#0F2532] dark:text-slate-400">Gestiona los procedimientos realizados y sus costos.
        </p>
      </div>
      <button id="add-tratamiento-btn"
        class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-[#4EABBE] hover:bg-[#1D5D69] text-white font-semibold shadow-lg shadow-[#4EABBE]/30 transition">
        Anadir tratamiento
      </button>
    </header>

    <section
      class="bg-white border border-[#8BCFDD]/60 rounded-3xl shadow-lg shadow-[#8BCFDD]/20 p-5 dark:bg-[#0E1A25] dark:border-slate-800">
      <div id="tratamientos-list"
        class="space-y-3 max-h-[70vh] overflow-auto pr-1 text-sm text-[#0F2532] dark:text-slate-100"></div>
    </section>
  </main>

  <!-- Modal -->
  <div id="modal-tratamiento"
    class="fixed inset-0 bg-[#0F2532]/70 backdrop-blur-sm flex items-center justify-center hidden">
    <div
      class="bg-white border border-[#8BCFDD]/60 rounded-3xl w-full max-w-xl p-6 shadow-2xl shadow-[#8BCFDD]/30 dark:bg-[#0E1A25] dark:border-slate-800">
      <div class="flex justify-between items-start mb-4">
        <div>
          <p class="text-[11px] uppercase tracking-[0.2em] text-[#1D5D69] dark:text-slate-400">Nuevo</p>
          <h3 class="text-xl font-semibold text-[#1D5D69] dark:text-white">Tratamiento</h3>
        </div>
        <button id="close-modal-tratamiento"
          class="text-slate-400 hover:text-[#0F2532] text-lg leading-none dark:hover:text-slate-100">&times;</button>
      </div>

      <form id="form-tratamiento" class="space-y-4">
        <div>
          <label
            class="block text-xs font-semibold uppercase tracking-[0.12em] text-[#0F2532] dark:text-slate-300">Procedimiento</label>
          <input type="text" name="procedimiento"
            class="w-full px-3 py-2.5 rounded-xl bg-white border border-[#8BCFDD] text-sm text-[#0F2532] placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-[#4EABBE] focus:border-[#4EABBE] dark:bg-[#0F2532] dark:border-slate-700 dark:text-slate-100"
            required />
        </div>
        <div class="grid gap-4 md:grid-cols-2">
          <div>
            <label
              class="block text-xs font-semibold uppercase tracking-[0.12em] text-[#0F2532] dark:text-slate-300">Diente</label>
            <input type="text" name="diente"
              class="w-full px-3 py-2.5 rounded-xl bg-white border border-[#8BCFDD] text-sm text-[#0F2532] placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-[#4EABBE] focus:border-[#4EABBE] dark:bg-[#0F2532] dark:border-slate-700 dark:text-slate-100" />
          </div>
          <div>
            <label
              class="block text-xs font-semibold uppercase tracking-[0.12em] text-[#0F2532] dark:text-slate-300">Costo</label>
            <input type="number" step="0.01" name="costo"
              class="w-full px-3 py-2.5 rounded-xl bg-white border border-[#8BCFDD] text-sm text-[#0F2532] placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-[#4EABBE] focus:border-[#4EABBE] dark:bg-[#0F2532] dark:border-slate-700 dark:text-slate-100" />
          </div>
        </div>
        <div>
          <label
            class="block text-xs font-semibold uppercase tracking-[0.12em] text-[#0F2532] dark:text-slate-300">Notas</label>
          <textarea name="notas" rows="3"
            class="w-full px-3 py-2.5 rounded-xl bg-white border border-[#8BCFDD] text-sm text-[#0F2532] placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-[#4EABBE] focus:border-[#4EABBE] dark:bg-[#0F2532] dark:border-slate-700 dark:text-slate-100"></textarea>
        </div>

        <div class="space-y-3">
          <label
            class="block text-xs font-semibold uppercase tracking-[0.12em] text-[#0F2532] dark:text-slate-300">Medicamento</label>
          <select id="select-medicamento-tratamiento"
            class="w-full px-3 py-2.5 rounded-xl bg-white border border-[#8BCFDD] text-sm text-[#0F2532] focus:outline-none focus:ring-2 focus:ring-[#4EABBE] focus:border-[#4EABBE] dark:bg-[#0F2532] dark:border-slate-700 dark:text-slate-100"></select>
          <button type="button" id="btn-add-med-tratamiento"
            class="px-4 py-2 rounded-xl bg-[#4EABBE] hover:bg-[#1D5D69] text-white font-semibold shadow shadow-[#4EABBE]/30 transition">Anadir
            medicamento</button>
          <div id="lista-receta-tratamiento" class="space-y-2 text-sm text-[#0F2532] dark:text-slate-100"></div>
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" id="cancel-tratamiento"
            class="px-4 py-2 rounded-xl border border-[#8BCFDD] text-[#0F2532] hover:border-[#4EABBE] hover:text-[#1D5D69] transition dark:text-slate-100 dark:border-slate-700 dark:hover:border-[#4EABBE] dark:hover:text-white">Cancelar</button>
          <button type="submit"
            class="px-5 py-2.5 rounded-xl bg-[#4EABBE] hover:bg-[#1D5D69] text-white font-semibold shadow-lg shadow-[#4EABBE]/30 transition">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../scripts/tratamientos.js"></script>
</body>

</html>
