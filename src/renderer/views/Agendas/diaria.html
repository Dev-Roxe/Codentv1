<!-- Vista Diaria de Agenda - Mejorada -->
<div class="flex gap-0 h-full">
  <!-- ========== PANEL LATERAL IZQUIERDO ========== -->
  <div id="leftPanel"
    class="w-80 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 flex flex-col transition-colors">

    <!-- Fecha Grande -->
    <div
      class="p-6 border-b border-gray-200 dark:border-gray-700 bg-gradient-to-br from-[#1D5D69] to-[#4EABBE] text-white relative overflow-hidden">
      <!-- Decorative circles -->
      <div class="absolute top-0 right-0 w-32 h-32 bg-white/10 rounded-full -mr-16 -mt-16 blur-2xl"></div>
      <div class="absolute bottom-0 left-0 w-24 h-24 bg-black/10 rounded-full -ml-12 -mb-12 blur-xl"></div>

      <div class="relative z-10">
        <div class="flex items-center justify-between mb-4">
          <button id="prevDay" class="p-2 hover:bg-white/20 rounded-xl transition-all active:scale-95"
            aria-label="Día anterior">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
          </button>
          <div class="text-center">
            <div id="dayNumber" class="text-6xl font-bold leading-none tracking-tighter drop-shadow-sm">01</div>
            <div id="monthYear" class="text-lg text-white/90 mt-1 font-medium">Enero 2025</div>
          </div>
          <button id="nextDay" class="p-2 hover:bg-white/20 rounded-xl transition-all active:scale-95"
            aria-label="Día siguiente">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
            </svg>
          </button>
        </div>
        <div id="dayName"
          class="text-center text-white/90 font-bold uppercase tracking-widest text-sm bg-black/10 py-1 rounded-lg mx-auto w-fit px-4 backdrop-blur-sm">
          Lunes</div>

        <!-- Botón Crear Cita -->
        <button id="createAptBtn"
          class="w-full mt-6 py-3.5 bg-white dark:bg-gray-800 text-[#1D5D69] dark:text-white rounded-xl font-bold hover:bg-gray-50 dark:hover:bg-gray-700 transition-all flex items-center justify-center gap-2 shadow-lg shadow-black/10 transform hover:-translate-y-0.5">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
          </svg>
          Nueva Cita
        </button>
      </div>
    </div>

    <!-- Resumen del día -->
    <div class="p-4 border-b border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900/50 transition-colors">
      <div class="grid grid-cols-3 gap-3">
        <div
          class="bg-white dark:bg-gray-800 p-3 rounded-xl border border-gray-100 dark:border-gray-700 shadow-sm text-center group hover:border-[#4EABBE]/30 transition-all">
          <p id="statTotalCitas"
            class="text-2xl font-bold text-[#1D5D69] dark:text-[#4EABBE] group-hover:scale-110 transition-transform">0
          </p>
          <p class="text-[10px] uppercase font-bold text-gray-400 dark:text-gray-500 tracking-wide mt-1">Total</p>
        </div>
        <div
          class="bg-white dark:bg-gray-800 p-3 rounded-xl border border-gray-100 dark:border-gray-700 shadow-sm text-center group hover:border-green-500/30 transition-all">
          <p id="statConfirmadas"
            class="text-2xl font-bold text-green-600 dark:text-green-400 group-hover:scale-110 transition-transform">0
          </p>
          <p class="text-[10px] uppercase font-bold text-gray-400 dark:text-gray-500 tracking-wide mt-1">Ok</p>
        </div>
        <div
          class="bg-white dark:bg-gray-800 p-3 rounded-xl border border-gray-100 dark:border-gray-700 shadow-sm text-center group hover:border-orange-500/30 transition-all">
          <p id="statPendientes"
            class="text-2xl font-bold text-orange-500 dark:text-orange-400 group-hover:scale-110 transition-transform">0
          </p>
          <p class="text-[10px] uppercase font-bold text-gray-400 dark:text-gray-500 tracking-wide mt-1">Pend</p>
        </div>
      </div>
    </div>

    <!-- Selector de Dentista -->
    <div class="p-5 border-b border-gray-200 dark:border-gray-700">
      <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wide mb-2">Filtrar por
        Dentista</label>
      <div class="relative">
        <select id="dentistSelect"
          class="w-full pl-10 pr-4 py-2.5 border border-gray-200 dark:border-gray-600 rounded-xl bg-gray-50 dark:bg-gray-700 text-gray-700 dark:text-white focus:ring-2 focus:ring-[#4EABBE] focus:border-[#4EABBE] focus:bg-white dark:focus:bg-gray-600 transition-all appearance-none cursor-pointer font-medium text-sm">
          <option value="">Todos los dentistas</option>
        </select>
        <div class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
        </div>
        <div class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
          </svg>
        </div>
      </div>
    </div>

    <!-- Filtros de Estado -->
    <div class="flex-1 overflow-y-auto p-5 custom-scrollbar">
      <div class="flex items-center justify-between mb-4">
        <span class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wide">Estados</span>
        <button id="markAllBtn"
          class="text-xs text-[#4EABBE] hover:text-[#1D5D69] dark:hover:text-white font-semibold transition-colors">Marcar
          todos</button>
      </div>
      <div id="filtersDiv" class="space-y-2">
        <!-- Filtros generados por JS -->
      </div>
    </div>

    <!-- Recarga automática -->
    <div class="p-4 border-t border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900/50 transition-colors">
      <label class="flex items-center gap-3 cursor-pointer group select-none">
        <div class="relative">
          <input id="autoReloadCheckbox" type="checkbox" class="peer sr-only">
          <div
            class="w-10 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-cyan-300 dark:peer-focus:ring-cyan-800 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-[#4EABBE]">
          </div>
        </div>
        <div>
          <p class="text-sm font-semibold text-gray-700 dark:text-white group-hover:text-[#4EABBE] transition-colors">
            Auto-actualizar</p>
          <p class="text-xs text-gray-400 dark:text-gray-500">Cada 60s</p>
        </div>
      </label>
    </div>
  </div>

  <!-- ========== PANEL DERECHO - LISTA DE CITAS ========== -->
  <div id="rightPanel" class="flex-1 flex flex-col bg-gray-50 dark:bg-gray-900 transition-colors relative">

    <!-- Background Pattern -->
    <div class="absolute inset-0 opacity-[0.03] dark:opacity-[0.05] pointer-events-none"
      style="background-image: radial-gradient(#4EABBE 1px, transparent 1px); background-size: 20px 20px;">
    </div>

    <!-- Header de tabla -->
    <div
      class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 shadow-sm sticky top-0 z-20 transition-colors px-6 py-4">
      <div class="grid grid-cols-[80px_1fr_180px_140px_120px] gap-6 items-center">
        <div class="text-xs font-bold text-gray-400 dark:text-gray-500 uppercase tracking-wider">Hora</div>
        <div class="text-xs font-bold text-gray-400 dark:text-gray-500 uppercase tracking-wider">Paciente</div>
        <div class="text-xs font-bold text-gray-400 dark:text-gray-500 uppercase tracking-wider">Dentista</div>
        <div class="text-xs font-bold text-gray-400 dark:text-gray-500 uppercase tracking-wider">Estado</div>
        <div class="text-xs font-bold text-gray-400 dark:text-gray-500 uppercase tracking-wider text-center">Acciones
        </div>
      </div>
    </div>

    <!-- Contenedor de citas -->
    <div id="appointmentsRows" class="flex-1 overflow-y-auto relative z-10 p-4 space-y-3 custom-scrollbar">
      <!-- Citas generadas por JS -->
      <div class="flex flex-col items-center justify-center h-full text-center">
        <div class="w-16 h-16 border-4 border-[#4EABBE]/30 border-t-[#4EABBE] rounded-full animate-spin mb-6"></div>
        <h3 class="text-lg font-semibold text-gray-700 dark:text-gray-200">Cargando agenda...</h3>
        <p class="text-gray-400 dark:text-gray-500 text-sm mt-1">Por favor espere un momento</p>
      </div>
    </div>
  </div>
</div>
