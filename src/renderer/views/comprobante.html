<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data: blob:; script-src 'self' 'unsafe-inline' file:; style-src 'self' 'unsafe-inline' file:; img-src 'self' data: blob: file:; font-src 'self' data: file:; media-src 'self' data: blob: file:; connect-src 'self' file:; frame-src 'self' file:; object-src 'none'; base-uri 'self'; form-action 'self';" />
    <title>Comprobante</title>
    <link rel="stylesheet" href="../styles/output.css" />
    <script>
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <script src="../scripts/init.js" type="module"></script>
</head>

<body class="min-h-screen bg-[#F8F7F7] text-[#0F2532] dark:bg-[#0B1721] dark:text-slate-100">
    <main class="max-w-4xl mx-auto p-6 space-y-6">
        <header class="rounded-3xl border border-[#8BCFDD]/50 bg-white dark:bg-[#0E1A25] p-6 shadow-lg shadow-[#8BCFDD]/10">
            <div class="flex flex-col gap-4 md:flex-row md:items-start md:justify-between">
                <div class="space-y-1">
                    <p class="text-xs uppercase tracking-[0.2em] text-[#1D5D69] dark:text-slate-400">Comprobante interno</p>
                    <h1 id="invoice-title" class="text-2xl font-bold text-[#1D5D69] dark:text-white">Cargando comprobante...</h1>
                    <p class="text-sm text-[#0F2532]/70 dark:text-slate-400">Documento interno sin validez fiscal (sin CFDI/SAT).</p>
                </div>
                <div class="flex flex-wrap gap-3">
                    <button id="btn-print"
                        type="button"
                        class="px-4 py-2.5 rounded-xl bg-[#4EABBE] hover:bg-[#1D5D69] text-sm font-semibold text-white shadow-lg shadow-[#4EABBE]/30 transition">
                        Imprimir
                    </button>
                    <button id="btn-close"
                        type="button"
                        class="px-4 py-2.5 rounded-xl border border-[#8BCFDD] dark:border-slate-700 text-sm font-semibold hover:border-[#4EABBE] transition">
                        Cerrar
                    </button>
                </div>
            </div>
        </header>

        <section id="invoice-feedback"
            class="rounded-3xl border border-[#8BCFDD]/50 bg-white dark:bg-[#0E1A25] p-6 shadow-lg shadow-[#8BCFDD]/10">
            <p class="text-sm text-[#1D5D69] dark:text-slate-400">Cargando informacion del comprobante...</p>
        </section>

        <section id="invoice-card"
            class="hidden rounded-3xl border border-[#8BCFDD]/50 bg-white dark:bg-[#0E1A25] p-6 shadow-lg shadow-[#8BCFDD]/10">
            <div class="flex flex-col gap-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <article class="rounded-2xl border border-[#8BCFDD]/25 dark:border-slate-700 bg-[#F8F7F7]/70 dark:bg-slate-900/40 p-4">
                        <p class="text-xs uppercase tracking-[0.12em] text-[#1D5D69] dark:text-slate-400">Folio</p>
                        <p id="invoice-folio" class="mt-2 text-lg font-bold text-[#0F2532] dark:text-white">-</p>
                    </article>
                    <article class="rounded-2xl border border-[#8BCFDD]/25 dark:border-slate-700 bg-[#F8F7F7]/70 dark:bg-slate-900/40 p-4">
                        <p class="text-xs uppercase tracking-[0.12em] text-[#1D5D69] dark:text-slate-400">Total</p>
                        <p id="invoice-total" class="mt-2 text-2xl font-bold text-emerald-600 dark:text-emerald-400">$0.00</p>
                    </article>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-3">
                        <h2 class="text-lg font-bold text-[#1D5D69] dark:text-white">Detalle</h2>
                        <div id="invoice-details" class="space-y-3"></div>
                    </div>
                    <div class="space-y-3">
                        <h2 class="text-lg font-bold text-[#1D5D69] dark:text-white">Totales</h2>
                        <div id="invoice-totals" class="space-y-3"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="../scripts/comprobante.js"></script>
    <script src="../scripts/session-timeout.js"></script>
</body>

</html>
