<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data: blob:; script-src 'self' 'unsafe-inline' file:; style-src 'self' 'unsafe-inline' file:; img-src 'self' data: blob: file:; font-src 'self' data: file:; media-src 'self' data: blob: file:; connect-src 'self' file:; frame-src 'self' file:; object-src 'none'; base-uri 'self'; form-action 'self';" />
    <title>Receta Médica</title>
    <link href="../styles/output.css" rel="stylesheet">
    <script src="../scripts/init.js" type="module"></script>
</head>

<body class="bg-[#E5E7EB] min-h-screen p-4 font-sans print:p-0 print:bg-white text-black">
    <div class="flex gap-6 justify-center max-w-7xl mx-auto items-start print:block print:m-0 print:w-full print:max-w-full print:bg-white">
        
        <!-- Sidebar de Medicamentos -->
        <div class="w-80 bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-5 border border-gray-100 dark:border-gray-700 sticky top-4 print:hidden flex-shrink-0">
            <h2 class="text-xl font-bold text-[#1D5D69] dark:text-white mb-4 flex items-center">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                </svg>
                Insumos / Méd.
            </h2>
            <div class="relative mb-4">
                <input type="text" id="sidebar-search" placeholder="Buscar medicamento..." class="w-full pl-10 pr-4 py-2 border border-gray-300 dark:border-gray-600 rounded-xl bg-gray-50 dark:bg-gray-700 text-[#0F2532] dark:text-white focus:ring-2 focus:ring-primary outline-none text-sm">
                <svg class="w-4 h-4 absolute left-3 top-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </div>
            <div id="sidebar-meds-lista" class="space-y-2 max-h-[70vh] overflow-y-auto pr-1">
                <div class="text-center py-4 text-gray-500 text-sm">Cargando...</div>
            </div>
        </div>

        <!-- Contenido de la Receta -->
        <div class="flex-1 max-w-[21cm] paper-white rounded-md shadow-2xl overflow-hidden print:shadow-none print:w-full">
            
            <div class="relative min-h-[29.7cm] print:min-h-full paper-white flex flex-col">
                <!-- Watermark -->
                <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-0 mt-[100px]" style="opacity: 0.04;">
                    <img src="../assets/marca-agua-sonalia.png" alt="" class="w-[80%] max-w-[500px] object-contain" style="width: 80%; max-width: 500px;">
                </div>

                <!-- Header Sonalia -->
                <div class="prescription-header border-b-[3px] border-[#9B1C1C] px-8 pt-8 pb-4 relative z-10 mx-6">
                    <div class="flex justify-between items-start">
                        <div class="w-1/2">
                            <img src="../assets/logo-sonalia.png" alt="Sonalia" class="mb-2" style="height: 105px; width: auto; max-width: 100%; object-fit: contain;">
                        </div>
                        <div class="w-1/2 text-right">
                            <h1 id="header-titular-nombre" class="text-[13px] font-bold uppercase text-[#1B325F] tracking-wide mb-1"></h1>
                            <p class="text-[10px] font-bold uppercase text-[#1B325F] tracking-wider mb-0.5"><span id="header-titular-especialidad"></span></p>
                            <p class="text-[10px] font-bold uppercase text-[#1B325F] tracking-wider mb-0.5">CED. PROF. <span id="header-titular-cedula"></span></p>
                            <p id="header-titular-rfc-line" class="text-[9px] font-bold uppercase text-[#1B325F] tracking-wider mb-0.5 hidden">RFC: <span id="header-titular-rfc"></span></p>
                            <p class="text-[9px] font-bold uppercase text-[#1B325F] tracking-wider mb-0.5 max-w-[80%] ml-auto" id="header-clinica-direccion"></p>
                            <p id="header-clinica-telefono-line" class="text-[9px] font-bold uppercase text-[#1B325F] tracking-wider mb-0.5 hidden">TEL. <span id="header-clinica-telefono"></span></p>
                            <p class="text-[9px] font-bold uppercase text-[#1B325F] tracking-wider" id="header-clinica-nombre"></p>
                        </div>
                    </div>
                </div>

                <!-- Patient Info Inline -->
                <div class="patient-info px-12 py-6 relative z-10 flex flex-col gap-2 flex-shrink-0">
                    <div class="text-[11px] font-bold uppercase text-[#1B325F] flex flex-wrap gap-x-6 gap-y-2">
                        <div class="w-full">
                            NOMBRE DEL PACIENTE: <span id="paciente-nombre" class="text-black font-normal ml-1">Cargando...</span>
                        </div>
                        <div class="flex gap-4 w-full">
                            <div class="flex">
                                FECHA NACIMIENTO: <span id="paciente-fecha-nac" class="text-black font-normal ml-1">--</span>
                            </div>
                            <div class="flex">
                                SEXO: <span id="paciente-sexo" class="text-black font-normal ml-1">--</span>
                            </div>
                            <div class="flex">
                                CURP/RFC: <span id="paciente-curp" class="text-black font-normal ml-1">--</span>
                            </div>
                            <div class="ml-auto flex">
                                FECHA: <span id="fecha-receta" class="text-black font-normal ml-1">--/--/----</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Prescription Content -->
                <div class="prescription-content px-12 py-4 relative z-10 flex-1">
                    <h2 class="text-[14px] font-bold text-[#1B325F] mb-6 tracking-wide">
                        TRATAMIENTO:
                    </h2>
                    <div id="medicamentos-lista" class="space-y-6">
                        <!-- Medicamentos dinámicos -->
                    </div>
                </div>

                <!-- Footer / Firm -->
                <div class="prescription-footer px-12 pt-8 pb-12 relative z-10 mt-auto flex-shrink-0">
                    <div class="border-t-[2px] border-[#9B1C1C] pt-2 mb-8 w-full text-center">
                    </div>
                    
                    <div class="flex justify-center flex-col items-center">
                        <div class="text-center w-64 border-t-[2px] border-[#1B325F] pt-2">
                            <p class="text-[10px] font-bold text-[#1B325F] uppercase tracking-wide">FIRMA</p>
                            <p id="footer-titular-nombre" class="text-[11px] font-bold text-[#1B325F] uppercase tracking-wide mt-1"></p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Print Button -->
            <div class="bg-gray-100 dark:bg-gray-800 p-4 text-center print:hidden border-t border-gray-200 dark:border-gray-700 flex justify-center flex-wrap gap-4">
                <button id="printPreviewRecetaBtn" type="button" class="bg-[#1B325F] text-white px-8 py-3 rounded-full font-bold hover:bg-blue-800 transition-colors shadow-md">
                    <svg class="w-5 h-5 inline-block mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path>
                    </svg>
                    Vista previa / Imprimir
                </button>
            </div>

        </div>
    </div>

    <style>
        /* Fuentes profesionales para impresión */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Ocultar el chat de soporte en la vista de recetas */
        support-chatbot {
            display: none !important;
        }

        /* Asegurar que los colores prevalezcan sobre el modo oscuro tanto en pantalla como al imprimir */
        .paper-white { background-color: white !important; }
        .text-\[\#1B325F\] { color: #1B325F !important; }
        .text-\[\#9B1C1C\] { color: #9B1C1C !important; }
        .text-black { color: black !important; }
        .border-\[\#9B1C1C\] { border-color: #9B1C1C !important; }
        .border-\[\#1B325F\] { border-color: #1B325F !important; }

        @media print {
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                box-shadow: none !important;
                text-shadow: none !important;
            }

            @page {
                margin: 0;
                size: A4 portrait;
            }

            html, body {
                background-color: white !important;
                background: white !important;
                padding: 0 !important;
                margin: 0 !important;
                color: black !important;
                width: 100%;
                height: 100%;
            }

            .flex-1.max-w-\[21cm\] {
                width: 100% !important;
                max-width: 100% !important;
                margin: 0 !important;
                border: none !important;
                box-shadow: none !important;
                border-radius: 0 !important;
            }
            
            .min-h-\[29\.7cm\] {
                min-height: 100vh !important;
                height: auto !important;
            }

            .print\:hidden, #sidebar-meds-lista, #sidebar-search, .w-80 {
                display: none !important;
            }
            .medication-item {
                page-break-inside: avoid;
            }
        }
    </style>

    <script src="../scripts/receta_medica.js"></script>
    <script src="../scripts/session-timeout.js"></script>
</body>

</html>
